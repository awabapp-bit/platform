<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>منتدى الأسئلة — منصة أواب الإلكترونية</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="shell.css?v=1">
<link rel="stylesheet" href="forum.css?v=1">
</head>
<body>

<header class="ah-bar" id="appHeader"></header>

<main class="fm" id="forumRoot">
  <div class="center-loading"><div class="loader"></div></div>
</main>

<div class="fm-lightbox" id="lightbox" role="dialog" aria-label="عرض الصورة">
  <button type="button" id="lightboxClose" aria-label="إغلاق"></button>
  <img id="lightboxImg" src="" alt="">
</div>

<footer class="sf-footer" id="siteFooter"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js?v=2"></script>
<script src="app-shell.js?v=3"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var compId = params.get('id');
  if (!compId) { window.location.href = 'home.html'; return; }

  var $ = function (id) { return document.getElementById(id); };
  var root = $('forumRoot');
  var currentUser = null, currentUserData = null, compData = null, isEnrolled = false;
  var pendingImage = null, questions = {}, filter = 'all', sending = false;
  var contentUrl = 'competition.html?id=' + encodeURIComponent(compId);
  var ic = function (n) { return icon(n, 'fm-ic'); };

  $('lightboxClose').innerHTML = icon('xmark', 'fm-ic');

  requireAuth(function (user, userData) {
    currentUser = user; currentUserData = userData;
    renderAppHeader(user, userData, { showPoints: true });
    renderFooter();
    load();
  });

  function forumRef() { return db.ref('forumQuestions/' + compId); }
  function safeImg(u) { return /^data:image\//.test(u || '') || /^https:\/\//.test(u || '') ? u : ''; }

  function load() {
    db.ref('competitions/' + compId).once('value').then(function (snap) {
      if (!snap.exists()) { window.location.href = 'home.html'; return; }
      compData = snap.val();
      return db.ref('userEnrollments/' + currentUser.uid + '/' + compId).once('value').then(function (e) {
        isEnrolled = e.exists();
        renderShell();
        if (isEnrolled) listen();
      });
    });
  }

  /* ===== الهيكل: العنوان + (صندوق السؤال والأسئلة) أو (رسالة القفل) ===== */
  function renderShell() {
    var isCourse = compData.type !== 'competition';
    var title = compData.title || (isCourse ? 'كورس' : 'مسابقة');
    var cover = safeImg(compData.coverUrl);

    var html =
      '<a class="fm-back" href="' + contentUrl + '">' + ic('arrowRight') + 'رجوع إلى ' + (isCourse ? 'الكورس' : 'المسابقة') + '</a>' +
      '<section class="fm-top">' +
        '<div class="fm-arch" aria-hidden="true">' + (cover ? '<img src="' + escapeHtml(cover) + '" alt="">' : ic(isCourse ? 'bookOpen' : 'trophy')) + '</div>' +
        '<div><h1>منتدى الأسئلة</h1><p>' + escapeHtml(title) + '</p></div>' +
      '</section>';

    if (!isEnrolled) {
      html +=
        '<section class="fm-lock">' +
          '<div class="fm-arch" aria-hidden="true">' + ic('lock') + '</div>' +
          '<h3>المنتدى مغلق</h3>' +
          '<p>' + (isCourse ? 'اشترك في الكورس' : 'انضم إلى المسابقة') + ' أولًا لتتمكن من السؤال ومشاهدة أسئلة زملائك.</p>' +
          '<a class="fm-send" href="' + contentUrl + '">' + (isCourse ? 'الذهاب إلى الكورس' : 'الذهاب إلى المسابقة') + '</a>' +
        '</section>';
      root.innerHTML = html;
      return;
    }

    html +=
      '<section class="fm-ask" aria-label="اسأل سؤالًا">' +
        '<div class="fm-ask-row">' +
          '<span class="fm-avatar" aria-hidden="true">' + escapeHtml((currentUserData.name || '؟').trim().charAt(0)) + '</span>' +
          '<textarea id="qInput" maxlength="600" rows="3" placeholder="ما سؤالك عن هذا ' + (isCourse ? 'الكورس' : 'المحتوى') + '؟" aria-label="نص السؤال"></textarea>' +
        '</div>' +
        '<div class="fm-preview" id="preview"><img id="previewImg" alt="الصورة المرفقة"><button type="button" id="previewRemove" aria-label="إزالة الصورة">' + ic('xmark') + '</button></div>' +
        '<p class="fm-error" id="qError" role="alert"></p>' +
        '<p class="fm-note">' + ic('lock') + 'سؤالك يظهر لك وللإدارة فقط، ولا يراه زملاؤك إلا بعد أن تنشره الإدارة.</p>' +
        '<div class="fm-ask-foot">' +
          '<label class="fm-attach">' + ic('image') + '<span>إضافة صورة</span><input type="file" id="imgInput" accept="image/*" hidden></label>' +
          '<span class="fm-count" id="qCount">0 / 600</span>' +
          '<button type="button" class="fm-send" id="qSend">' + ic('paperPlane') + 'إرسال السؤال</button>' +
        '</div>' +
      '</section>' +
      '<div class="fm-head"><h2>أسئلة الطلاب</h2><div class="fm-tabs" id="tabs" role="tablist"></div></div>' +
      '<div class="fm-feed" id="feed"><div class="center-loading" style="min-height:80px;"><div class="loader"></div></div></div>';
    root.innerHTML = html;

    $('imgInput').addEventListener('change', onImagePick);
    $('previewRemove').addEventListener('click', clearImage);
    $('qSend').addEventListener('click', sendQuestion);
    $('qInput').addEventListener('input', function () { $('qCount').textContent = this.value.length + ' / 600'; });
    $('qInput').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendQuestion(); });
  }

  /* ===== الصورة: ضغط عبر Canvas ثم Base64 (لا يوجد Firebase Storage) ===== */
  function compress(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var w = img.width, h = img.height;
          if (w > h) { if (w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; } }
          else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = function () { reject(new Error('read')); };
        img.src = e.target.result;
      };
      r.onerror = function () { reject(new Error('read')); };
      r.readAsDataURL(file);
    });
  }
  function onImagePick(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (file.type.indexOf('image/') !== 0) { showToast('الملف المختار ليس صورة', 'error'); return; }
    compress(file, 900, 0.65).then(function (d) {
      if (d.length <= 450000) return d;
      return compress(file, 640, 0.5).then(function (s) { if (s.length > 450000) throw new Error('big'); return s; });
    }).then(function (d) {
      pendingImage = d;
      $('previewImg').src = d;
      $('preview').classList.add('show');
    }).catch(function () { showToast('تعذّر إرفاق الصورة، جرّب صورة أصغر', 'error'); });
  }
  function clearImage() {
    pendingImage = null;
    $('previewImg').src = '';
    $('preview').classList.remove('show');
  }

  /* ===== إرسال سؤال ===== */
  function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.focus(); }

  function sendQuestion() {
    if (sending) return;
    var input = $('qInput'), btn = $('qSend'), err = $('qError');
    var text = input.value.trim();
    err.classList.remove('show');
    if (!text) { shake(input); return; }
    sending = true; input.disabled = true; btn.disabled = true;
    var payload = { uid: currentUser.uid, name: currentUserData.name || 'مستخدم', text: text, createdAt: firebase.database.ServerValue.TIMESTAMP, published: false };
    if (pendingImage) payload.imageData = pendingImage;
    forumRef().push(payload).then(function () {
      input.value = ''; $('qCount').textContent = '0 / 600'; clearImage();
      showToast('تم إرسال سؤالك، وسيظهر لك فقط حتى تنشره الإدارة', 'success'); filter = 'mine';
    }).catch(function (e) {
      err.textContent = 'تعذّر إرسال السؤال' + (e && e.message ? ': ' + e.message : '') + '. حاول مرة أخرى.';
      err.classList.add('show');
    }).then(function () { sending = false; input.disabled = false; btn.disabled = false; });
  }

  /* ===== الأسئلة: استماع حيّ + تبويبات ===== */
  /* المسؤول يقرأ كل شيء. المستخدم يقرأ نوعين فقط (تفرضهما قواعد Firebase):
     المنشور للجميع + أسئلته هو. */
  var pubData = {}, mineData = {}, failed = 0;
  function merge() { questions = Object.assign({}, pubData, mineData); renderFeed(); }
  function onFail(err) {
    console.error(err);
    if (++failed >= (currentUserData.isAdmin ? 1 : 2)) {
      var f = $('feed');
      if (f) f.innerHTML = '<div class="fm-empty"><h3>تعذّر تحميل الأسئلة</h3><p>تحقق من الاتصال وأعد تحميل الصفحة.</p></div>';
    }
  }
  function listen() {
    if (currentUserData.isAdmin) {
      forumRef().on('value', function (s) { questions = s.val() || {}; renderFeed(); }, onFail);
      return;
    }
    forumRef().orderByChild('published').equalTo(true).on('value', function (s) { pubData = s.val() || {}; merge(); }, onFail);
    forumRef().orderByChild('uid').equalTo(currentUser.uid).on('value', function (s) { mineData = s.val() || {}; merge(); }, onFail);
  }

  function sortedIds() {
    return Object.keys(questions).sort(function (a, b) { return (questions[b].createdAt || 0) - (questions[a].createdAt || 0); });
  }

  /* منتظِر: بلا رد. وللمسؤول أيضًا: غير منشور (يحتاج قرارًا) */
  function isPending(q) { return !q.adminReply || (currentUserData.isAdmin && q.published !== true); }

  function renderTabs(ids) {
    var mine = ids.filter(function (i) { return questions[i].uid === currentUser.uid; }).length;
    var pending = ids.filter(function (i) { return isPending(questions[i]); }).length;
    var defs = [['all', 'الكل', ids.length], ['mine', 'أسئلتي', mine], ['pending', 'بانتظار الرد', pending]];
    $('tabs').innerHTML = defs.map(function (d) {
      return '<button type="button" role="tab" class="fm-tab' + (filter === d[0] ? ' active' : '') + '" aria-selected="' + (filter === d[0]) + '" data-f="' + d[0] + '">' + d[1] + '<small>' + d[2] + '</small></button>';
    }).join('');
    $('tabs').querySelectorAll('.fm-tab').forEach(function (b) {
      b.addEventListener('click', function () { filter = b.dataset.f; renderFeed(); });
    });
  }

  function renderFeed() {
    var feed = $('feed'); if (!feed) return;
    var all = sortedIds();
    renderTabs(all);

    /* حفظ ما يكتبه المسؤول في خانات الرد قبل إعادة الرسم */
    var drafts = {}, focusId = null;
    feed.querySelectorAll('.fm-reply-form textarea').forEach(function (t) {
      if (t.value) drafts[t.dataset.q] = t.value;
      if (document.activeElement === t) focusId = t.dataset.q;
    });

    var ids = all.filter(function (id) {
      var q = questions[id];
      return filter === 'mine' ? q.uid === currentUser.uid : filter === 'pending' ? isPending(q) : true;
    });

    if (!ids.length) {
      var msgs = {
        all: ['لا توجد أسئلة بعد', 'كن أول من يسأل في هذا المنتدى.'],
        mine: ['لم تسأل شيئًا بعد', 'اكتب سؤالك في الأعلى وسيصلك الرد هنا.'],
        pending: ['لا توجد أسئلة منتظرة', currentUserData.isAdmin ? 'كل الأسئلة منشورة ومُجاب عنها.' : 'كل الأسئلة التي تراها تم الرد عليها.']
      }[filter];
      feed.innerHTML = '<div class="fm-empty"><div class="fm-arch" aria-hidden="true">' + ic('commentDots') + '</div><h3>' + msgs[0] + '</h3><p>' + msgs[1] + '</p></div>';
      return;
    }

    feed.innerHTML = ids.map(function (id) {
      var q = questions[id], mine = q.uid === currentUser.uid, rep = q.adminReply, img = safeImg(q.imageData);
      var published = q.published === true, admin = currentUserData.isAdmin, status = '', head = '';
      if (rep) {
        status +=
          '<div class="fm-reply"><div class="fm-who"><span class="fm-avatar admin" aria-hidden="true">' + ic('shield') + '</span>' +
          '<div class="fm-who-text"><div class="fm-name">إدارة أواب</div><div class="fm-time">' + formatArabicDate(rep.createdAt) + '</div></div></div>' +
          '<p class="fm-text">' + escapeHtml(rep.text) + '</p></div>';
      } else if (admin) {
        status +=
          '<div class="fm-reply-form"><textarea data-q="' + id + '" rows="2" placeholder="اكتب ردًا باسم إدارة المنصة..." aria-label="رد الإدارة"></textarea>' +
          '<button type="button" data-reply="' + id + '">' + ic('reply') + 'رد</button></div>';
      } else if (published) {
        status += '<span class="fm-pending">' + ic('hourglass') + 'بانتظار رد الإدارة</span>';
      }
      if (!published) {
        head = '<span class="fm-state private">' + ic('lock') + (admin ? 'غير منشور' : 'لا يراه غيرك') + '</span>';
        if (!admin && !rep) status += '<span class="fm-pending">' + ic('hourglass') + 'بانتظار الإدارة: تنشره أو ترد عليك</span>';
      }
      if (admin) {
        status += '<div class="fm-admin-bar">' +
          (published
            ? '<button type="button" class="fm-ghost" data-unpublish="' + id + '">' + ic('eyeSlash') + 'إلغاء النشر</button>'
            : '<button type="button" class="fm-publish" data-publish="' + id + '">' + ic('eye') + 'نشر للجميع</button>') +
          '</div>';
      }
      return '<article class="fm-post' + (mine ? ' mine' : '') + (published ? '' : ' unpub') + '">' +
        '<div class="fm-who"><span class="fm-avatar" aria-hidden="true">' + escapeHtml((q.name || '؟').trim().charAt(0)) + '</span>' +
        '<div class="fm-who-text"><div class="fm-name">' + escapeHtml(q.name || 'مستخدم') + (mine ? '<span class="fm-tag">سؤالك</span>' : '') + head + '</div>' +
        '<div class="fm-time">' + formatArabicDate(q.createdAt) + '</div></div></div>' +
        '<p class="fm-text">' + escapeHtml(q.text) + '</p>' +
        (img ? '<img class="fm-img" src="' + escapeHtml(img) + '" alt="صورة مرفقة بالسؤال" loading="lazy">' : '') +
        status + '</article>';
    }).join('');

    feed.querySelectorAll('.fm-img').forEach(function (im) {
      im.addEventListener('click', function () { $('lightboxImg').src = im.src; $('lightbox').classList.add('open'); });
    });
    feed.querySelectorAll('.fm-reply-form').forEach(function (f) {
      var t = f.querySelector('textarea'), b = f.querySelector('button');
      if (drafts[t.dataset.q]) t.value = drafts[t.dataset.q];
      if (focusId === t.dataset.q) t.focus();
      b.addEventListener('click', function () { sendReply(t.dataset.q, t, b); });
    });
    feed.querySelectorAll('[data-publish]').forEach(function (b) {
      b.addEventListener('click', function () { setPublished(b.dataset.publish, true, b); });
    });
    feed.querySelectorAll('[data-unpublish]').forEach(function (b) {
      b.addEventListener('click', function () { setPublished(b.dataset.unpublish, false, b); });
    });
  }

  /* ===== نشر السؤال للجميع / إلغاء النشر (للمسؤول فقط) ===== */
  function notify(q, title, body) {
    if (!q || !q.uid || q.uid === currentUser.uid) return Promise.resolve();
    return db.ref('notifications/' + q.uid).push({
      type: 'reply', title: title, body: body, link: 'forum.html?id=' + compId, read: false, createdAt: firebase.database.ServerValue.TIMESTAMP
    }).catch(function (e) { console.error('تعذّر إرسال الإشعار:', e); });
  }
  function setPublished(qid, value, btn) {
    if (!currentUserData.isAdmin) return;
    btn.disabled = true;
    var qRef = forumRef().child(qid);
    qRef.child('published').set(value).then(function () {
      showToast(value ? 'تم نشر السؤال للجميع' : 'تم إلغاء النشر، والسؤال الآن ظاهر لصاحبه فقط', 'success');
      if (value) { var q = questions[qid]; if (q) return notify(q, 'تم نشر سؤالك في المنتدى', q.text && q.text.length > 60 ? q.text.slice(0, 60) + '…' : (q.text || '')); }
    }).catch(function (e) {
      showToast('تعذّر تنفيذ الإجراء' + (e && e.message ? ': ' + e.message : ''), 'error');
      btn.disabled = false;
    });
  }

  /* ===== رد الإدارة + إشعار لصاحب السؤال ===== */
  function sendReply(qid, input, btn) {
    var text = input.value.trim();
    if (!text) { shake(input); return; }
    input.disabled = true; btn.disabled = true;
    var qRef = forumRef().child(qid);
    qRef.once('value').then(function (snap) {
      var q = snap.val();
      return qRef.child('adminReply').set({ text: text, createdAt: firebase.database.ServerValue.TIMESTAMP }).then(function () {
        if (q && q.uid && q.uid !== currentUser.uid) {
          return db.ref('notifications/' + q.uid).push({
            type: 'reply', title: 'تم الرد على سؤالك في المنتدى',
            body: text.length > 60 ? text.slice(0, 60) + '…' : text,
            link: 'forum.html?id=' + compId, read: false, createdAt: firebase.database.ServerValue.TIMESTAMP
          }).catch(function (e) { console.error('تعذّر إرسال إشعار الرد:', e); });
        }
      });
    }).catch(function (e) {
      showToast('تعذّر إرسال الرد' + (e && e.message ? ': ' + e.message : ''), 'error');
      input.disabled = false; btn.disabled = false;
    });
  }

  /* ===== عارض الصور ===== */
  function closeBox() { $('lightbox').classList.remove('open'); }
  $('lightboxClose').addEventListener('click', closeBox);
  $('lightbox').addEventListener('click', function (e) { if (e.target === this) closeBox(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeBox(); });
})();
</script>
</body>
</html>
