<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>الحساب الشخصي — منصة أواب الإلكترونية</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  /* ===== التبويبات ===== */
  .account-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
    border-bottom: 2px solid var(--border);
    flex-wrap: wrap;
  }
  .account-tab {
    padding: 12px 22px;
    border: none;
    background: none;
    font-weight: 700;
    font-size: 15px;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s ease;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .account-tab:hover { color: var(--primary); }
  .account-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  .account-tab i { font-size: 16px; }

  .tab-content { display: none; animation: fadeIn 0.3s ease; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== بطاقة المستوى ===== */
  .tier-card {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    color: #fff;
    position: relative;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .tier-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 85% 15%, rgba(201,154,74,0.25), transparent 55%);
    pointer-events: none;
  }
  .tier-card .tier-top {
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
    flex-wrap: wrap;
  }
  .tier-card .tier-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--rank-color, var(--gold-light));
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .tier-card .tier-name {
    font-family: 'Amiri', serif;
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tier-card .tier-rank-pill {
    font-family: 'Cairo', sans-serif;
    font-size: 11px;
    font-weight: 800;
    background: rgba(255,255,255,0.16);
    color: var(--rank-color, var(--gold-light));
    padding: 3px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .tier-card .tier-points {
    font-size: 13px;
    opacity: 0.85;
    margin-top: 4px;
  }
  .tier-card .tier-level-big {
    margin-inline-start: auto;
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: 32px;
    color: var(--rank-color, var(--gold-light));
    line-height: 1;
    position: relative;
    z-index: 1;
    flex-shrink: 0;
    text-align: center;
  }
  .tier-card .tier-level-big span {
    display: block;
    font-family: 'Cairo', sans-serif;
    font-size: 10px;
    font-weight: 700;
    opacity: 0.6;
    margin-top: 2px;
  }
  .tier-card .tier-progress-wrap {
    margin-top: 16px;
    position: relative;
    z-index: 1;
  }
  .tier-card .tier-progress-bar {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
  }
  .tier-card .tier-progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--gold-light), var(--gold));
    transition: width 0.5s ease;
  }
  .tier-card .tier-next-note {
    font-size: 12px;
    opacity: 0.75;
    margin-top: 8px;
  }

  /* ===== معلومات الحساب ===== */
  .info-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 26px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .label {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .info-row .label i { color: var(--gold); width: 18px; }
  .info-row .value {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .edit-profile-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1.5px solid var(--primary);
    color: var(--primary);
    padding: 10px 22px;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .edit-profile-btn:hover {
    background: rgba(27,77,53,0.06);
    transform: translateY(-1px);
  }

  /* ===== زر حذف الحساب ===== */
  .delete-account-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1.5px solid var(--danger);
    color: var(--danger);
    padding: 10px 22px;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    margin-top: 12px;
  }
  .delete-account-btn:hover {
    background: rgba(179,67,43,0.08);
    transform: translateY(-1px);
  }
  .delete-account-btn i { font-size: 14px; }

  /* ===== الاشتراكات والاختبارات ===== */
  .enrolled-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
    transition: all 0.15s ease;
  }
  .enrolled-card:hover {
    box-shadow: var(--shadow);
    transform: translateY(-2px);
    border-color: var(--primary-light);
  }
  .enrolled-card .ec-cover {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    flex-shrink: 0;
    overflow: hidden;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold-pale);
    font-size: 22px;
  }
  .enrolled-card .ec-body { flex: 1; min-width: 0; }
  .enrolled-card .ec-title {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
  }
  .enrolled-card .ec-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .exam-history-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 12px;
    transition: all 0.15s ease;
  }
  .exam-history-card:hover {
    box-shadow: var(--shadow);
    border-color: var(--primary-light);
  }
  .exam-history-card .exam-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .exam-history-card .exam-info .exam-title {
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
  }
  .exam-history-card .exam-info .exam-title i {
    color: var(--gold);
    margin-left: 6px;
  }
  .exam-history-card .exam-score {
    font-weight: 800;
    color: var(--gold);
    font-size: 14px;
  }
  .exam-history-card .exam-score i { margin-left: 4px; }
  .exam-detail-btn {
    background: none;
    border: none;
    color: var(--primary);
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
    font-family: inherit;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
  }
  .exam-detail-btn:hover {
    background: rgba(27,77,53,0.06);
  }

  .exam-answers-popup {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(18,52,36,0.65);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .exam-answers-popup.open { display: flex; }
  .exam-answers-content {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    max-width: 620px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 28px 30px;
    box-shadow: var(--shadow-lift);
    position: relative;
  }
  .exam-answers-content .popup-close {
    position: absolute;
    top: 16px;
    left: 16px;
    background: var(--bg);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .exam-answers-content .popup-close:hover {
    background: var(--border);
  }
  .exam-answers-content h3 {
    font-family: 'Amiri', serif;
    color: var(--primary-dark);
    margin: 0 0 18px;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .exam-answers-content h3 i { color: var(--gold); }

  .exam-answer-item {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .exam-answer-item:last-child { border-bottom: none; }
  .exam-answer-item .q-text {
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 14.5px;
    color: var(--text);
  }
  .exam-answer-item .q-text i { color: var(--gold); margin-left: 6px; }
  .exam-answer-item .a-detail {
    font-size: 13.5px;
    color: var(--text);
    margin: 2px 0;
  }
  .exam-answer-item .a-detail strong { color: var(--primary-dark); }
  .exam-answer-item .a-status {
    font-weight: 700;
    font-size: 13px;
    margin-top: 4px;
  }
  .exam-answer-item .a-status.correct { color: var(--success); }
  .exam-answer-item .a-status.wrong { color: var(--danger); }
  .exam-answer-item .a-status.unanswered { color: var(--text-muted); }

  #editProfileWrap .field { margin-bottom: 14px; }
  #editProfileWrap .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 6px;
  }
  #editProfileWrap .field input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    background: #FCFBF8;
    color: var(--text);
    transition: border-color 0.15s ease;
  }
  #editProfileWrap .field input:focus {
    border-color: var(--primary);
    outline: none;
  }
  .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .edit-actions .btn { width: auto; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .empty-state i {
    font-size: 40px;
    display: block;
    margin-bottom: 12px;
    color: var(--text-muted);
    opacity: 0.5;
  }
  .empty-state p { font-size: 14px; }

  /* ============================================================
     نافذة حذف الحساب المتكاملة (Modal)
     ============================================================ */
  .delete-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(18,52,36,0.7);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeInOverlay 0.3s ease;
  }
  .delete-modal-overlay.open { display: flex; }
  @keyframes fadeInOverlay {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .delete-modal {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    max-width: 480px;
    width: 100%;
    padding: 32px 30px;
    box-shadow: var(--shadow-lift);
    position: relative;
    animation: slideUp 0.3s ease;
    direction: rtl;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .delete-modal .modal-close {
    position: absolute;
    top: 14px;
    left: 14px;
    background: var(--bg);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .delete-modal .modal-close:hover {
    background: var(--border);
  }

  .delete-modal .modal-icon {
    text-align: center;
    font-size: 48px;
    color: var(--danger);
    margin-bottom: 12px;
  }
  .delete-modal .modal-icon i { font-size: 48px; }

  .delete-modal h3 {
    font-family: 'Amiri', serif;
    color: var(--primary-dark);
    font-size: 20px;
    text-align: center;
    margin: 0 0 8px;
  }
  .delete-modal p {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.8;
    margin: 0 0 18px;
  }
  .delete-modal .field {
    margin-bottom: 14px;
  }
  .delete-modal .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 6px;
  }
  .delete-modal .field input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    background: #FCFBF8;
    color: var(--text);
    transition: border-color 0.15s ease;
  }
  .delete-modal .field input:focus {
    border-color: var(--primary);
    outline: none;
  }

  .delete-modal .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .delete-modal .modal-actions .btn {
    width: auto;
    flex: 1;
    min-width: 100px;
  }
  .delete-modal .modal-actions .btn-danger {
    background: linear-gradient(135deg, var(--danger), #8a3120);
    color: #fff;
    border: none;
    box-shadow: 0 6px 20px rgba(179,67,43,0.25);
  }
  .delete-modal .modal-actions .btn-danger:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(179,67,43,0.32);
  }
  .delete-modal .modal-actions .btn-danger:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .delete-modal .error-msg {
    font-size: 13px;
    color: var(--danger);
    background: #FBEAE6;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-top: 10px;
    display: none;
  }
  .delete-modal .error-msg.show { display: block; }

  .delete-modal .success-msg {
    font-size: 13px;
    color: var(--success);
    background: #E6F2EA;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-top: 10px;
    display: none;
  }
  .delete-modal .success-msg.show { display: block; }

  .delete-modal .loading-spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .delete-modal .step-indicator {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .delete-modal .step-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s ease;
  }
  .delete-modal .step-dot.active {
    background: var(--gold);
  }
  .delete-modal .step-dot.done {
    background: var(--success);
  }

  @media (max-width: 600px) {
    .account-tabs { gap: 4px; }
    .account-tab { padding: 10px 14px; font-size: 13px; }
    .tier-card { padding: 18px 20px; }
    .tier-card .tier-top { gap: 12px; }
    .tier-card .tier-level-big { font-size: 26px; }
    .exam-history-card { flex-direction: column; align-items: stretch; }
    .exam-history-card .exam-info { gap: 2px; }
    .exam-detail-btn { align-self: flex-start; }
    .exam-answers-content { padding: 20px; }
    .delete-modal { padding: 24px 18px; }
    .delete-modal .modal-actions .btn { min-width: 80px; font-size: 13px; }
  }
</style>
</head>
<body>

<header class="app-header" id="appHeader"></header>

<main class="page" style="max-width:740px;">
  <a class="back-link" href="home.html">
    <i class="fas fa-arrow-right"></i> الرئيسية
  </a>
  <h1 class="page-title"><i class="fas fa-user-circle" style="color:var(--gold);"></i> حسابي</h1>

  <!-- ===== التبويبات ===== -->
  <div class="account-tabs" id="tabsContainer">
    <button class="account-tab active" data-tab="info">
      <i class="fas fa-id-card"></i> معلوماتي
    </button>
    <button class="account-tab" data-tab="subscriptions">
      <i class="fas fa-book"></i> اشتراكاتي
    </button>
    <button class="account-tab" data-tab="exams">
      <i class="fas fa-pencil-alt"></i> اختباراتي
    </button>
  </div>

  <!-- ===== تبويب المعلومات ===== -->
  <div class="tab-content active" id="tab-info">
    <div id="tierCardWrap"></div>

    <div class="info-card">
      <div class="info-row">
        <span class="label"><i class="fas fa-user"></i> الاسم</span>
        <span class="value" id="userName">—</span>
      </div>
      <div class="info-row">
        <span class="label"><i class="fas fa-envelope"></i> البريد الإلكتروني</span>
        <span class="value" id="userEmail">—</span>
      </div>
      <div class="info-row">
        <span class="label"><i class="fas fa-trophy"></i> المستوى</span>
        <span class="value" id="userLevel">—</span>
      </div>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <button class="edit-profile-btn" id="editProfileBtn">
        <i class="fas fa-pen"></i> تعديل الملف الشخصي
      </button>
      <button class="delete-account-btn" id="deleteAccountBtn">
        <i class="fas fa-trash-alt"></i> حذف الحساب نهائياً
      </button>
    </div>

    <div id="editProfileWrap" style="display:none; margin-top:20px;">
      <div class="info-card">
        <h3 style="font-family:'Amiri',serif; color:var(--primary-dark); margin:0 0 16px;">
          <i class="fas fa-user-edit" style="color:var(--gold);"></i> تعديل الملف الشخصي
        </h3>
        <div class="form-msg" id="editProfileMsg"></div>
        <div class="field">
          <label><i class="fas fa-user"></i> الاسم الجديد</label>
          <input type="text" id="editNameInput" placeholder="أدخل اسمك الكامل">
        </div>
        <div class="field">
          <label><i class="fas fa-lock"></i> كلمة المرور الجديدة</label>
          <input type="password" id="editPassInput" placeholder="اتركها فارغة إذا لا تريد تغييرها">
          <div class="field-hint" style="font-size:12px; color:var(--text-muted); margin-top:4px;">يجب أن تكون 8 أحرف على الأقل لتغيير كلمة المرور</div>
        </div>
        <div class="edit-actions">
          <button class="btn btn-primary" id="saveProfileBtn"><i class="fas fa-save"></i> حفظ التغييرات</button>
          <button class="btn btn-outline" id="cancelEditBtn"><i class="fas fa-times"></i> إلغاء</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== تبويب الاشتراكات ===== -->
  <div class="tab-content" id="tab-subscriptions">
    <div id="enrolledWrap">
      <div class="center-loading"><div class="loader"></div></div>
    </div>
  </div>

  <!-- ===== تبويب الاختبارات ===== -->
  <div class="tab-content" id="tab-exams">
    <div id="examsHistoryWrap">
      <div class="center-loading"><div class="loader"></div></div>
    </div>
  </div>
</main>

<!-- ===== نافذة عرض الإجابات ===== -->
<div class="exam-answers-popup" id="answersPopup">
  <div class="exam-answers-content">
    <button class="popup-close" onclick="document.getElementById('answersPopup').classList.remove('open')">
      <i class="fas fa-times"></i>
    </button>
    <h3><i class="fas fa-eye"></i> تفاصيل الإجابات</h3>
    <div id="answersList"></div>
  </div>
</div>

<!-- ==============================================================
     نافذة حذف الحساب المتكاملة (Modal)
     ============================================================== -->
<div class="delete-modal-overlay" id="deleteModal">
  <div class="delete-modal">
    <button class="modal-close" id="deleteModalClose" aria-label="إغلاق">
      <i class="fas fa-times"></i>
    </button>

    <!-- المؤشر (نقاط المراحل) -->
    <div class="step-indicator" id="stepIndicator">
      <span class="step-dot active" data-step="1"></span>
      <span class="step-dot" data-step="2"></span>
      <span class="step-dot" data-step="3"></span>
      <span class="step-dot" data-step="4"></span>
    </div>

    <!-- أيقونة -->
    <div class="modal-icon" id="modalIcon">
      <i class="fas fa-exclamation-triangle"></i>
    </div>

    <!-- العنوان -->
    <h3 id="modalTitle">تأكيد حذف الحساب</h3>

    <!-- المحتوى الديناميكي -->
    <div id="modalBody">
      <!-- سيتم ملؤه بواسطة JavaScript -->
    </div>

    <!-- رسائل الخطأ/النجاح -->
    <div class="error-msg" id="modalError"></div>
    <div class="success-msg" id="modalSuccess"></div>

    <!-- الأزرار -->
    <div class="modal-actions" id="modalActions">
      <!-- سيتم ملؤه بواسطة JavaScript -->
    </div>
  </div>
</div>

<footer class="site-footer" id="siteFooter"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="app-shell.js"></script>
<script>
  // ============================================================
  // account.html — الحساب الشخصي
  // ============================================================

  let currentUser = null;
  let currentUserData = null;

  requireAuth(function (user, userData) {
    currentUser = user;
    currentUserData = userData;
    renderAppHeader(user, userData, { showPoints: false });
    renderFooter();
    renderInfoTab();
    loadSubscriptions();
    loadExamsHistory();
    setupTabs();
    setupEditProfile();
    setupDeleteAccountModal();
  });

  // ===== تبويب المعلومات =====
  function renderInfoTab() {
    const tier = getUserTier(currentUserData.points || 0);

    document.getElementById('userName').textContent = currentUserData.name || '—';
    document.getElementById('userEmail').textContent = currentUserData.email || currentUser.email || '—';
    document.getElementById('userLevel').textContent = 'المستوى ' + tier.level + ' (' + tier.rank.name + ')';

    document.getElementById('tierCardWrap').innerHTML = `
      <div class="tier-card" style="--rank-color: ${tier.rank.color};">
        <div class="tier-top">
          <div class="tier-icon"><i class="fas fa-${tier.rank.icon}"></i></div>
          <div>
            <div class="tier-name">
              ${tier.rank.name}
              <span class="tier-rank-pill">المستوى ${tier.level}</span>
            </div>
            <div class="tier-points"><i class="fas fa-star" style="color:var(--gold);"></i> ${tier.points} نقطة</div>
          </div>
          <div class="tier-level-big">${tier.level}<span>/${tier.maxLevel}</span></div>
        </div>
        <div class="tier-progress-wrap">
          <div class="tier-progress-bar">
            <div class="tier-progress-fill" style="width: ${tier.progress}%;"></div>
          </div>
          <div class="tier-next-note">
            ${tier.isMax ? '🎉 وصلت لأعلى مستوى! 👑' : 'محتاج ' + tier.pointsToNext + ' نقطة للمستوى ' + (tier.level + 1) + ' (' + tier.progress + '%)'}
          </div>
        </div>
      </div>
    `;
  }

  // ===== تبويب الاشتراكات =====
  function loadSubscriptions() {
    const wrap = document.getElementById('enrolledWrap');
    db.ref('userEnrollments/' + currentUser.uid).on('value', function (snap) {
      const enrolls = snap.val() || {};
      const ids = Object.keys(enrolls);
      if (ids.length === 0) {
        wrap.innerHTML = `<div class="empty-state"><i class="fas fa-book-open"></i><p>لا توجد اشتراكات حالية</p></div>`;
        return;
      }
      Promise.all(ids.map(id => db.ref('competitions/' + id).once('value').then(s => ({ id, data: s.val() }))))
        .then(results => {
          const html = results.filter(r => r.data).map(r => `
            <a class="enrolled-card" href="competition.html?id=${encodeURIComponent(r.id)}">
              <div class="ec-cover"><i class="fas fa-${r.data.type !== 'competition' ? 'book' : 'trophy'}"></i></div>
              <div class="ec-body">
                <div class="ec-title">${escapeHtml(r.data.title || 'بدون عنوان')}</div>
                <div class="ec-sub">${r.data.type !== 'competition' ? 'كورس' : 'مسابقة'}</div>
              </div>
            </a>
          `).join('');
          wrap.innerHTML = html || `<div class="empty-state"><i class="fas fa-book-open"></i><p>لا توجد اشتراكات</p></div>`;
        });
    });
  }

  // ===== تبويب الاختبارات =====
  function loadExamsHistory() {
    const wrap = document.getElementById('examsHistoryWrap');
    wrap.innerHTML = '<div class="center-loading"><div class="loader"></div></div>';

    db.ref('userProgress/' + currentUser.uid).once('value').then(function (snap) {
      const progress = snap.val() || {};
      const examsList = [];

      Object.keys(progress).forEach(compId => {
        const compProgress = progress[compId] || {};
        Object.keys(compProgress).forEach(lessonId => {
          const lessonProg = compProgress[lessonId] || {};
          const exams = lessonProg.exams || {};
          Object.keys(exams).forEach(examId => {
            const e = exams[examId];
            if (e.completed === true) {
              examsList.push({
                compId,
                lessonId,
                examId,
                score: e.score || 0,
                earnedPoints: e.earnedPoints || 0,
                answers: e.answers || {},
                answeredAt: e.answeredAt || Date.now()
              });
            }
          });
        });
      });

      examsList.sort((a, b) => b.answeredAt - a.answeredAt);
      renderExamsHistory(examsList);
    }).catch(err => {
      wrap.innerHTML = '<p style="color:var(--danger);"><i class="fas fa-exclamation-circle"></i> حدث خطأ: ' + err.message + '</p>';
    });
  }

  function renderExamsHistory(list) {
    const wrap = document.getElementById('examsHistoryWrap');
    if (list.length === 0) {
      wrap.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>لم تخض أي اختبار حتى الآن</p></div>`;
      return;
    }

    let html = '';
    list.forEach((exam, idx) => {
      html += `
        <div class="exam-history-card">
          <div class="exam-info">
            <div class="exam-title"><i class="fas fa-pencil-alt"></i> اختبار #${idx+1}</div>
            <div class="exam-score"><i class="fas fa-star"></i> ${exam.earnedPoints} نقطة · ${exam.score} إجابة صحيحة</div>
          </div>
          <button class="exam-detail-btn" data-comp="${exam.compId}" data-lesson="${exam.lessonId}" data-exam="${exam.examId}">
            <i class="fas fa-eye"></i> عرض الإجابات
          </button>
        </div>
      `;
    });
    wrap.innerHTML = html;

    wrap.querySelectorAll('.exam-detail-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        showExamDetails(btn.dataset.comp, btn.dataset.lesson, btn.dataset.exam);
      });
    });
  }

  function showExamDetails(compId, lessonId, examId) {
    const popup = document.getElementById('answersPopup');
    const list = document.getElementById('answersList');
    list.innerHTML = '<div class="center-loading"><div class="loader"></div></div>';
    popup.classList.add('open');

    db.ref('competitions/' + compId + '/lessons/' + lessonId + '/exams/' + examId).once('value').then(function (snap) {
      const exam = snap.val();
      if (!exam) { list.innerHTML = '<p>لا توجد بيانات للاختبار</p>'; return; }
      const questions = exam.questions || {};
      const qIds = Object.keys(questions);

      db.ref('userProgress/' + currentUser.uid + '/' + compId + '/' + lessonId + '/exams/' + examId + '/answers').once('value').then(function (aSnap) {
        const userAnswers = aSnap.val() || {};
        let html = '';

        qIds.forEach(qId => {
          const q = questions[qId];
          const selected = userAnswers[qId];
          const isCorrect = (selected !== undefined && selected === q.correct);
          const correctAnswer = q.options[q.correct] || '';
          const userAnswer = (selected !== undefined && selected >= 0 && selected < q.options.length) ? q.options[selected] : '—';

          let statusClass = 'unanswered';
          let statusText = '❓ لم يجب';
          if (selected !== undefined && selected >= 0) {
            statusClass = isCorrect ? 'correct' : 'wrong';
            statusText = isCorrect ? '✅ صحيح' : '❌ خاطئ';
          }

          html += `
            <div class="exam-answer-item">
              <div class="q-text"><i class="fas fa-question-circle"></i> ${escapeHtml(q.text)}</div>
              <div class="a-detail"><strong>إجابتك:</strong> ${escapeHtml(userAnswer)}</div>
              <div class="a-detail"><strong>الإجابة الصحيحة:</strong> ${escapeHtml(correctAnswer)}</div>
              <div class="a-status ${statusClass}">${statusText}</div>
            </div>
          `;
        });

        list.innerHTML = html || '<p>لا توجد إجابات مسجلة</p>';
      });
    }).catch(err => {
      list.innerHTML = '<p style="color:var(--danger);"><i class="fas fa-exclamation-circle"></i> حدث خطأ: ' + err.message + '</p>';
    });
  }

  // ===== التبويبات =====
  function setupTabs() {
    const tabs = document.querySelectorAll('.account-tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', function () {
        tabs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + this.dataset.tab).classList.add('active');
      });
    });
  }

  // ===== تعديل الملف الشخصي =====
  function setupEditProfile() {
    const editBtn = document.getElementById('editProfileBtn');
    const wrap = document.getElementById('editProfileWrap');
    const cancelBtn = document.getElementById('cancelEditBtn');
    const nameInput = document.getElementById('editNameInput');
    const passInput = document.getElementById('editPassInput');
    const msg = document.getElementById('editProfileMsg');

    editBtn.addEventListener('click', function () {
      wrap.style.display = 'block';
      nameInput.value = currentUserData.name || '';
      passInput.value = '';
      msg.classList.remove('show');
    });

    cancelBtn.addEventListener('click', function () {
      wrap.style.display = 'none';
      msg.classList.remove('show');
    });

    document.getElementById('saveProfileBtn').addEventListener('click', function () {
      msg.classList.remove('show');
      const newName = nameInput.value.trim();
      const newPass = passInput.value;

      if (!newName) {
        msg.textContent = 'الاسم مطلوب';
        msg.className = 'form-msg show error';
        return;
      }

      const updates = {};
      let nameChanged = false;
      let passChanged = false;

      if (newName !== currentUserData.name) {
        updates['users/' + currentUser.uid + '/name'] = newName;
        nameChanged = true;
      }

      if (newPass.length >= 8) {
        passChanged = true;
      } else if (newPass.length > 0 && newPass.length < 8) {
        msg.textContent = 'كلمة المرور الجديدة يجب أن تكون 8 أحرف على الأقل';
        msg.className = 'form-msg show error';
        return;
      }

      const promises = [];

      if (nameChanged) {
        promises.push(currentUser.updateProfile({ displayName: newName }));
      }

      if (passChanged) {
        const currentPass = prompt('🔐 أدخل كلمة المرور الحالية لتأكيد تغيير كلمة المرور:');
        if (!currentPass) {
          msg.textContent = 'تم إلغاء تغيير كلمة المرور';
          msg.className = 'form-msg show error';
          return;
        }
        const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, currentPass);
        promises.push(
          currentUser.reauthenticateWithCredential(cred)
            .then(() => currentUser.updatePassword(newPass))
        );
      }

      if (Object.keys(updates).length > 0) {
        promises.push(db.ref().update(updates));
      }

      if (promises.length === 0) {
        msg.textContent = 'لا توجد تغييرات لحفظها';
        msg.className = 'form-msg show error';
        return;
      }

      const btn = this;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      Promise.all(promises)
        .then(() => {
          msg.textContent = '✅ تم تحديث الملف الشخصي بنجاح';
          msg.className = 'form-msg show success';
          if (nameChanged) currentUserData.name = newName;
          setTimeout(() => location.reload(), 1200);
        })
        .catch(err => {
          console.error(err);
          const errorMsg = err.code === 'auth/wrong-password' ? 'كلمة المرور الحالية غير صحيحة' :
                           err.code === 'auth/too-many-requests' ? 'محاولات كثيرة، حاول مرة أخرى بعد قليل' :
                           err.message || 'حدث خطأ غير متوقع';
          msg.textContent = '❌ ' + errorMsg;
          msg.className = 'form-msg show error';
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-save"></i> حفظ التغييرات';
        });
    });
  }

  // ============================================================
  // ✅ نافذة حذف الحساب المتكاملة (HTML + CSS + JS)
  // ============================================================
  function setupDeleteAccountModal() {
    const deleteBtn = document.getElementById('deleteAccountBtn');
    const modal = document.getElementById('deleteModal');
    const closeBtn = document.getElementById('deleteModalClose');
    const modalBody = document.getElementById('modalBody');
    const modalActions = document.getElementById('modalActions');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalError = document.getElementById('modalError');
    const modalSuccess = document.getElementById('modalSuccess');
    const stepDots = document.querySelectorAll('.step-dot');

    let currentStep = 1;
    let totalSteps = 4;
    let confirmText = '';
    let password1 = '';
    let password2 = '';

    // دالة لتحديث نقاط المراحل
    function updateSteps(step) {
      stepDots.forEach((dot, index) => {
        dot.classList.remove('active', 'done');
        if (index + 1 === step) dot.classList.add('active');
        else if (index + 1 < step) dot.classList.add('done');
      });
    }

    // دالة لإعادة تعيين النافذة
    function resetModal() {
      currentStep = 1;
      confirmText = '';
      password1 = '';
      password2 = '';
      modalError.classList.remove('show');
      modalSuccess.classList.remove('show');
      modalError.textContent = '';
      modalSuccess.textContent = '';
      updateSteps(1);
    }

    // دالة لعرض الخطوة الحالية
    function renderStep(step) {
      modalError.classList.remove('show');
      modalSuccess.classList.remove('show');
      modalError.textContent = '';
      modalSuccess.textContent = '';

      switch (step) {
        case 1: // التأكيد الأولي
          modalIcon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
          modalTitle.textContent = '⚠️ تأكيد حذف الحساب';
          modalBody.innerHTML = `
            <p style="font-size:15px; color:var(--text);">
              <strong>هل أنت متأكد أنك تريد حذف حسابك نهائياً؟</strong>
            </p>
            <p style="font-size:13.5px; color:var(--text-muted);">
              سيتم حذف كل بياناتك: نقاطك، تقدمك، اشتراكاتك، إشعاراتك.<br>
              <strong style="color:var(--danger);">لا يمكن استرجاع أي من هذه البيانات بعد الحذف.</strong>
            </p>
          `;
          modalActions.innerHTML = `
            <button class="btn btn-outline" id="deleteStepCancel" style="flex:1;">إلغاء</button>
            <button class="btn btn-danger" id="deleteStepNext" style="flex:1;">نعم، متأكد</button>
          `;
          document.getElementById('deleteStepCancel').addEventListener('click', closeModal);
          document.getElementById('deleteStepNext').addEventListener('click', function () {
            goToStep(2);
          });
          break;

        case 2: // تأكيد كتابي (كتابة كلمة "حذف")
          modalIcon.innerHTML = '<i class="fas fa-pen"></i>';
          modalTitle.textContent = '✍️ تأكيد كتابي';
          modalBody.innerHTML = `
            <p style="font-size:14px; color:var(--text-muted);">
              للتأكيد، اكتب كلمة <strong style="color:var(--danger);">"حذف"</strong> في المربع التالي:
            </p>
            <div class="field">
              <input type="text" id="deleteConfirmInput" placeholder="اكتب حذف هنا" autocomplete="off">
            </div>
          `;
          modalActions.innerHTML = `
            <button class="btn btn-outline" id="deleteStepBack" style="flex:1;">رجوع</button>
            <button class="btn btn-danger" id="deleteStepNext" style="flex:1;" disabled>تأكيد</button>
          `;
          const input = document.getElementById('deleteConfirmInput');
          const nextBtn = document.getElementById('deleteStepNext');
          input.addEventListener('input', function () {
            nextBtn.disabled = (this.value.trim() !== 'حذف');
          });
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && this.value.trim() === 'حذف') {
              goToStep(3);
            }
          });
          document.getElementById('deleteStepBack').addEventListener('click', function () {
            goToStep(1);
          });
          document.getElementById('deleteStepNext').addEventListener('click', function () {
            if (input.value.trim() === 'حذف') {
              confirmText = 'حذف';
              goToStep(3);
            }
          });
          setTimeout(() => input.focus(), 100);
          break;

        case 3: // كلمة المرور (المرة الأولى)
          modalIcon.innerHTML = '<i class="fas fa-lock"></i>';
          modalTitle.textContent = '🔐 أدخل كلمة المرور (مرة أولى)';
          modalBody.innerHTML = `
            <p style="font-size:14px; color:var(--text-muted);">
              أدخل كلمة المرور الحالية لتأكيد الهوية (المرة الأولى):
            </p>
            <div class="field">
              <input type="password" id="deletePass1" placeholder="كلمة المرور" autocomplete="off">
            </div>
          `;
          modalActions.innerHTML = `
            <button class="btn btn-outline" id="deleteStepBack" style="flex:1;">رجوع</button>
            <button class="btn btn-danger" id="deleteStepNext" style="flex:1;">التالي</button>
          `;
          const input1 = document.getElementById('deletePass1');
          document.getElementById('deleteStepBack').addEventListener('click', function () {
            goToStep(2);
          });
          document.getElementById('deleteStepNext').addEventListener('click', function () {
            const val = input1.value.trim();
            if (!val) {
              showError('يرجى إدخال كلمة المرور.');
              return;
            }
            password1 = val;
            goToStep(4);
          });
          input1.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              const val = this.value.trim();
              if (val) { password1 = val; goToStep(4); }
              else showError('يرجى إدخال كلمة المرور.');
            }
          });
          setTimeout(() => input1.focus(), 100);
          break;

        case 4: // كلمة المرور (المرة الثانية)
          modalIcon.innerHTML = '<i class="fas fa-lock"></i>';
          modalTitle.textContent = '🔐 أدخل كلمة المرور (مرة ثانية)';
          modalBody.innerHTML = `
            <p style="font-size:14px; color:var(--text-muted);">
              أدخل كلمة المرور الحالية مرة أخرى للتأكيد (المرة الثانية):
            </p>
            <div class="field">
              <input type="password" id="deletePass2" placeholder="كلمة المرور" autocomplete="off">
            </div>
          `;
          modalActions.innerHTML = `
            <button class="btn btn-outline" id="deleteStepBack" style="flex:1;">رجوع</button>
            <button class="btn btn-danger" id="deleteStepNext" style="flex:1;">تأكيد الحذف</button>
          `;
          const input2 = document.getElementById('deletePass2');
          document.getElementById('deleteStepBack').addEventListener('click', function () {
            goToStep(3);
          });
          document.getElementById('deleteStepNext').addEventListener('click', function () {
            const val = input2.value.trim();
            if (!val) {
              showError('يرجى إدخال كلمة المرور.');
              return;
            }
            password2 = val;
            if (password1 !== password2) {
              showError('❌ كلمتا المرور غير متطابقتين. حاول مرة أخرى.');
              // نرجع للخطوة 3 عشان يعيد إدخال كلمة المرور
              setTimeout(() => goToStep(3), 800);
              return;
            }
            // تنفيذ حذف الحساب
            executeDelete();
          });
          input2.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              const val = this.value.trim();
              if (!val) { showError('يرجى إدخال كلمة المرور.'); return; }
              password2 = val;
              if (password1 !== password2) {
                showError('❌ كلمتا المرور غير متطابقتين. حاول مرة أخرى.');
                setTimeout(() => goToStep(3), 800);
                return;
              }
              executeDelete();
            }
          });
          setTimeout(() => input2.focus(), 100);
          break;
      }
      updateSteps(step);
    }

    // الانتقال لخطوة معينة
    function goToStep(step) {
      if (step < 1 || step > totalSteps) return;
      currentStep = step;
      renderStep(step);
    }

    // عرض رسالة خطأ
    function showError(msg) {
      modalError.textContent = msg;
      modalError.classList.add('show');
    }

    // عرض رسالة نجاح
    function showSuccess(msg) {
      modalSuccess.textContent = msg;
      modalSuccess.classList.add('show');
    }

    // تنفيذ عملية الحذف
    function executeDelete() {
      // تعطيل الأزرار وإظهار التحميل
      const actions = document.getElementById('modalActions');
      actions.innerHTML = `
        <button class="btn btn-danger" style="flex:1; justify-content:center;" disabled>
          <span class="loading-spinner"></span> جاري حذف الحساب...
        </button>
      `;
      modalIcon.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
      modalTitle.textContent = '⏳ جاري حذف الحساب...';
      modalBody.innerHTML = '<p style="text-align:center; color:var(--text-muted);">يرجى الانتظار، يتم حذف بياناتك...</p>';
      modalError.classList.remove('show');
      modalSuccess.classList.remove('show');

      const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, password1);

      currentUser.reauthenticateWithCredential(credential)
        .then(function () {
          return deleteUserAccountData(currentUser.uid);
        })
        .then(function () {
          return currentUser.delete();
        })
        .then(function () {
          // نجاح
          modalIcon.innerHTML = '<i class="fas fa-check-circle" style="color:var(--success);"></i>';
          modalTitle.textContent = '✅ تم حذف الحساب بنجاح';
          modalBody.innerHTML = `
            <p style="text-align:center; color:var(--text-muted);">
              نأسف لفراقك، نتمنى رؤيتك مرة أخرى في المستقبل.
            </p>
          `;
          actions.innerHTML = `
            <button class="btn btn-primary" id="deleteFinalClose" style="flex:1;">تسجيل الخروج</button>
          `;
          document.getElementById('deleteFinalClose').addEventListener('click', function () {
            window.location.href = 'index.html';
          });
          // بعد 3 ثواني، نغلق النافذة ونخرج
          setTimeout(function () {
            window.location.href = 'index.html';
          }, 3000);
        })
        .catch(function (err) {
          console.error('خطأ أثناء حذف الحساب:', err);
          let errorMsg = '❌ فشل حذف الحساب: ';
          if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
            errorMsg += 'كلمة المرور الحالية غير صحيحة.';
          } else if (err.code === 'auth/requires-recent-login') {
            errorMsg += 'يجب إعادة تسجيل الدخول أولاً، ثم المحاولة مرة أخرى.';
          } else if (err.code === 'auth/too-many-requests') {
            errorMsg += 'محاولات كثيرة، حاول مرة أخرى بعد قليل.';
          } else {
            errorMsg += err.message || 'خطأ غير متوقع.';
          }
          showError(errorMsg);
          // إعادة تمكين الأزرار
          actions.innerHTML = `
            <button class="btn btn-outline" id="deleteStepBack" style="flex:1;">رجوع</button>
            <button class="btn btn-danger" id="deleteStepNext" style="flex:1;">إعادة المحاولة</button>
          `;
          document.getElementById('deleteStepBack').addEventListener('click', function () {
            goToStep(1);
          });
          document.getElementById('deleteStepNext').addEventListener('click', function () {
            goToStep(3);
          });
          modalIcon.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i>';
          modalTitle.textContent = '❌ فشل الحذف';
        });
    }

    // فتح النافذة
    function openModal() {
      resetModal();
      modal.classList.add('open');
      renderStep(1);
      document.body.style.overflow = 'hidden';
    }

    // إغلاق النافذة
    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
      resetModal();
    }

    // إغلاق بالضغط على الخلفية
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });

    // إغلاق بالضغط على زر الإغلاق
    closeBtn.addEventListener('click', closeModal);

    // إغلاق بالضغط على Escape
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
    });

    // ربط الزر بحذف الحساب
    deleteBtn.addEventListener('click', openModal);
  }

  // ===== إغلاق نافذة عرض الإجابات =====
  document.getElementById('answersPopup').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('open');
  });
</script>
</body>
</html>
