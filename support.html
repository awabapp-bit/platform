<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>الدعم الفني — منصة أواب الإلكترونية</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="support-body">

<header class="app-header" id="appHeader"></header>

<div class="support-fullpage" id="supportFullpage">
  <button type="button" class="support-back-btn" onclick="location.href='home.html'" aria-label="رجوع">
    <svg class="icon icon-sm" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M502.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L402.7 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l370.7 0-105.4 105.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/></svg>
  </button>

  <div class="support-chat-messages" id="supportMessages">
    <div class="center-loading" style="min-height:200px;"><div class="loader"></div></div>
  </div>

  <div class="support-rec-overlay" id="recOverlay">
    <div class="support-rec-status">
      <span class="support-rec-dot"></span>
      <span id="recTimer">00:00</span>
      <span class="support-rec-hint">جارٍ التسجيل...</span>
    </div>
    <div class="support-rec-actions">
      <button type="button" class="btn btn-outline btn-sm" id="cancelRecBtn" style="width:auto;">إلغاء</button>
      <button type="button" class="support-rec-send-btn" id="sendRecBtn" aria-label="إرسال التسجيل">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

  <form class="support-input-bar" id="supportForm">
    <button type="button" class="support-round-btn" id="attachTriggerBtn" aria-label="إرفاق ملف">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
    </button>
    <div class="support-input-wrapper">
      <textarea id="supportTextInput" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
    </div>
    <button type="submit" class="support-send-btn" id="sendTriggerBtn" aria-label="إرسال">
      <svg id="micSvg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      <svg id="sendSvg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </form>
</div>

<input type="file" id="fileUploadInput" accept="image/*,audio/*,.pdf,.doc,.docx,.txt,.zip" style="display:none">
<input type="file" id="fileVoiceInput" accept="audio/*" capture="microphone" style="display:none">

<div class="support-lightbox" id="imageLightbox">
  <button type="button" class="support-lightbox-close" id="closeLightbox" aria-label="إغلاق">
    <svg class="icon icon-md" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg>
  </button>
  <img class="support-lightbox-img" id="lightboxImg" src="" alt="">
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="app-shell.js"></script>
<script>
  let currentUser = null;
  let currentUserData = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let recordTimer = null;
  let recordStartTime = 0;
  let localStream = null;
  let currentMimeType = '';
  let activeVoicePlayers = {};

  const isWebView = /wv|WebView/.test(navigator.userAgent) ||
                    (navigator.userAgent.includes('Android') && !navigator.userAgent.includes('Chrome/'));
  const MAX_FILE_SIZE = 3 * 1024 * 1024; // 3MB لكل أنواع المرفقات

  const messagesEl    = document.getElementById('supportMessages');
  const textInput     = document.getElementById('supportTextInput');
  const micSvg        = document.getElementById('micSvg');
  const sendSvg       = document.getElementById('sendSvg');
  const attachTrigger = document.getElementById('attachTriggerBtn');
  const recOverlay    = document.getElementById('recOverlay');
  const recTimerEl    = document.getElementById('recTimer');
  const lightbox      = document.getElementById('imageLightbox');
  const lightboxImg   = document.getElementById('lightboxImg');

  requireAuth(function (user, userData) {
    currentUser = user;
    currentUserData = userData;
    renderAppHeader(user, userData, { showPoints: false });
    db.ref('users/' + user.uid).update({ status: 'online' }).catch(function () {});
    listenMessages();
  });

  /* ---------------- إرسال رسالة نصية ---------------- */
  async function sendMessage(type, text, fileUrl, fileName) {
    if (!navigator.onLine) { alert('لا يوجد اتصال بالإنترنت'); return; }
    const msgId = db.ref('messages/' + currentUser.uid).push().key;
    await db.ref('messages/' + currentUser.uid + '/' + msgId).set({
      id: msgId, sender: 'user', text: text || '', type: type,
      timestamp: Date.now(), fileUrl: fileUrl || '', fileName: fileName || ''
    });
    const snippets = { text: text, image: '📷 صورة', voice: '🎤 رسالة صوتية', audio: '🎵 ملف صوتي', file: '📁 ملف مرفق' };
    const cr = db.ref('conversations/' + currentUser.uid);
    const cs = await cr.once('value');
    const unread = ((cs.exists() ? cs.val().unreadCountByAdmin : 0) || 0) + 1;
    await cr.set({
      userId: currentUser.uid, userName: currentUserData.name || 'مستخدم',
      lastMessage: snippets[type] || text, lastMessageTimestamp: Date.now(),
      unreadCountByAdmin: unread, unreadCountByUser: 0
    });
  }

  document.getElementById('supportForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const txt = textInput.value.trim();
    if (txt) {
      sendMessage('text', txt);
      textInput.value = '';
      textInput.style.height = 'auto';
      micSvg.style.display = 'block';
      sendSvg.style.display = 'none';
    } else {
      startVoice();
    }
  });

  textInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 110) + 'px';
    const hasText = this.value.trim() !== '';
    micSvg.style.display  = hasText ? 'none'  : 'block';
    sendSvg.style.display = hasText ? 'block' : 'none';
  });
  textInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('supportForm').requestSubmit(); }
  });

  /* ---------------- رفع الملفات: زرار واحد، وبيتعرف على نوع الملف تلقائيًا ---------------- */
  attachTrigger.addEventListener('click', function () { document.getElementById('fileUploadInput').click(); });

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      const r = new FileReader();
      r.readAsDataURL(file);
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error('فشل قراءة الملف')); };
    });
  }
  async function toBase64(file) {
    if (file.size > MAX_FILE_SIZE) throw new Error('الحد الأقصى لحجم الملف 3 ميجابايت');
    return await fileToBase64(file);
  }

  function renderPlaceholder(id, txt) {
    const d = document.createElement('div');
    d.id = id; d.className = 'support-msg-row user';
    d.innerHTML = '<div class="support-bubble user" style="opacity:.7;"><span class="loading-spinner dark"></span> ' + txt + '</div>';
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  document.getElementById('fileUploadInput').addEventListener('change', async function (e) {
    const file = e.target.files[0];
    if (!file) return;
    let type = 'file';
    if (file.type.startsWith('image/')) type = 'image';
    else if (file.type.startsWith('audio/')) type = 'audio';
    const labels = { image: 'الصورة', audio: 'الملف الصوتي', file: 'الملف' };
    const id = 'tmp_' + type + '_' + Date.now();
    renderPlaceholder(id, 'جارٍ إرسال ' + labels[type] + '...');
    try {
      const b64 = await toBase64(file);
      const el = document.getElementById(id); if (el) el.remove();
      await sendMessage(type, '', b64, file.name);
    } catch (err) {
      const el = document.getElementById(id); if (el) el.remove();
      alert(err.message);
    }
    document.getElementById('fileUploadInput').value = '';
  });

  /* ---------------- تسجيل صوتي ---------------- */
  function stopTracks() { if (localStream) { localStream.getTracks().forEach(function (t) { t.stop(); }); localStream = null; } }

  async function startVoice() {
    if (!navigator.onLine) { alert('لا يوجد اتصال بالإنترنت'); return; }
    if (isWebView || !window.MediaRecorder) { document.getElementById('fileVoiceInput').click(); return; }
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/ogg'];
      const mime = types.find(function (t) { return MediaRecorder.isTypeSupported(t); }) || '';
      mediaRecorder = new MediaRecorder(localStream, mime ? { mimeType: mime } : {});
      currentMimeType = mediaRecorder.mimeType;
      audioChunks = [];
      mediaRecorder.ondataavailable = function (e) { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start(250);

      recOverlay.classList.add('open');
      recordStartTime = Date.now();
      recTimerEl.textContent = '00:00';
      recordTimer = setInterval(function () {
        const s = Math.floor((Date.now() - recordStartTime) / 1000);
        recTimerEl.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      }, 1000);
    } catch (err) {
      console.warn('MediaRecorder failed:', err.name, err.message);
      stopTracks();
      document.getElementById('fileVoiceInput').click();
    }
  }

  document.getElementById('cancelRecBtn').addEventListener('click', function () {
    clearInterval(recordTimer);
    recOverlay.classList.remove('open');
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    stopTracks(); audioChunks = [];
  });

  document.getElementById('sendRecBtn').addEventListener('click', function () {
    clearInterval(recordTimer);
    recOverlay.classList.remove('open');
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    mediaRecorder.onstop = async function () {
      stopTracks();
      if (!audioChunks.length) { alert('لم يتم التقاط صوت'); return; }
      let ext = 'webm';
      if (currentMimeType.includes('mp4')) ext = 'mp4';
      else if (currentMimeType.includes('ogg')) ext = 'ogg';
      const blob = new Blob(audioChunks, { type: currentMimeType || 'audio/webm' });
      const file = new File([blob], 'voice_' + Date.now() + '.' + ext, { type: blob.type });
      const id = 'tmp_v_' + Date.now();
      renderPlaceholder(id, 'جارٍ إرسال التسجيل...');
      try {
        const b64 = await toBase64(file);
        const el = document.getElementById(id); if (el) el.remove();
        await sendMessage('voice', '', b64, file.name);
      } catch (err) {
        const el = document.getElementById(id); if (el) el.remove();
        alert(err.message);
      }
    };
    mediaRecorder.stop();
  });

  document.getElementById('fileVoiceInput').addEventListener('change', async function (e) {
    const file = e.target.files[0]; if (!file) return;
    const id = 'tmp_fv_' + Date.now();
    renderPlaceholder(id, 'جارٍ إرسال الرسالة الصوتية...');
    try {
      const b64 = await toBase64(file);
      const el = document.getElementById(id); if (el) el.remove();
      await sendMessage('voice', '', b64, file.name);
    } catch (err) {
      const el = document.getElementById(id); if (el) el.remove();
      alert(err.message);
    }
    document.getElementById('fileVoiceInput').value = '';
  });

  /* ---------------- عرض الرسائل ---------------- */
  function listenMessages() {
    db.ref('messages/' + currentUser.uid).on('value', function (snap) {
      messagesEl.innerHTML = '';
      if (snap.exists()) {
        snap.forEach(function (c) { renderMsg(c.val()); return false; });
        messagesEl.scrollTop = messagesEl.scrollHeight;
        db.ref('conversations/' + currentUser.uid).update({ unreadCountByUser: 0 }).catch(function () {});
      } else {
        messagesEl.innerHTML = '<div class="support-welcome">مرحباً بك في دعم <strong>أواب</strong> 👋<br>أرسل رسالتك وسنجيبك في أقرب وقت بإذن الله</div>';
      }
    });
  }

  function renderMsg(msg) {
    const isUser = msg.sender === 'user';
    const row = document.createElement('div');
    row.className = 'support-msg-row ' + (isUser ? 'user' : 'admin');
    const bubble = document.createElement('div');
    bubble.className = 'support-bubble ' + (isUser ? 'user' : 'admin');

    if (msg.type === 'text') {
      bubble.innerText = msg.text;
    } else if (msg.type === 'image') {
      const img = document.createElement('img');
      img.src = msg.fileUrl; img.className = 'support-msg-img'; img.loading = 'lazy'; img.alt = 'صورة';
      img.addEventListener('click', function () { lightboxImg.src = msg.fileUrl; lightbox.classList.add('open'); });
      bubble.appendChild(img);
    } else if (msg.type === 'voice' || msg.type === 'audio') {
      bubble.appendChild(buildPlayer(msg.fileUrl, msg.id));
    } else if (msg.type === 'file') {
      const a = document.createElement('a');
      a.href = msg.fileUrl; a.download = msg.fileName || 'file'; a.target = '_blank';
      a.className = 'support-file-link';
      a.innerHTML = icon('fileLines', 'icon-md') +
        '<span class="support-file-name">' + (msg.fileName || 'ملف مرفق') + '</span>';
      bubble.appendChild(a);
    }

    const time = document.createElement('span');
    time.className = 'support-msg-time';
    time.textContent = new Date(msg.timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

    row.appendChild(bubble);
    row.appendChild(time);
    messagesEl.appendChild(row);
  }

  function buildPlayer(url, msgId) {
    const wrap = document.createElement('div');
    wrap.className = 'support-voice-player';

    const playBtn = document.createElement('button');
    playBtn.type = 'button';
    playBtn.className = 'support-voice-play-btn';
    const playSVG  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
    const pauseSVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
    playBtn.innerHTML = playSVG;

    const bar  = document.createElement('div'); bar.className  = 'support-voice-bar';
    const fill = document.createElement('div'); fill.className = 'support-voice-fill';
    bar.appendChild(fill);

    const timeEl = document.createElement('span'); timeEl.className = 'support-voice-time'; timeEl.textContent = '--:--';
    wrap.append(playBtn, bar, timeEl);

    const audio = new Audio(url);
    activeVoicePlayers[msgId] = audio;

    audio.addEventListener('loadedmetadata', function () { timeEl.textContent = fmtTime(audio.duration); });
    audio.addEventListener('error', function () { timeEl.textContent = 'خطأ'; });
    playBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      Object.values(activeVoicePlayers).forEach(function (a) { if (a !== audio) a.pause(); });
      audio.paused ? audio.play() : audio.pause();
    });
    audio.addEventListener('play',  function () { playBtn.innerHTML = pauseSVG; });
    audio.addEventListener('pause', function () { playBtn.innerHTML = playSVG; });
    audio.addEventListener('ended', function () { playBtn.innerHTML = playSVG; fill.style.width = '0%'; timeEl.textContent = fmtTime(audio.duration); });
    audio.addEventListener('timeupdate', function () { fill.style.width = ((audio.currentTime / audio.duration) * 100) + '%'; timeEl.textContent = fmtTime(audio.currentTime); });
    bar.addEventListener('click', function (e) {
      const r = bar.getBoundingClientRect();
      audio.currentTime = (1 - (e.clientX - r.left) / r.width) * audio.duration;
    });
    return wrap;
  }

  function fmtTime(s) {
    if (!s || isNaN(s)) return '00:00';
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  }

  document.getElementById('closeLightbox').addEventListener('click', function () { lightbox.classList.remove('open'); });
  lightbox.addEventListener('click', function (e) { if (e.target === lightbox) lightbox.classList.remove('open'); });

  window.addEventListener('beforeunload', function () {
    if (currentUser) { try { db.ref('users/' + currentUser.uid).update({ status: 'offline' }); } catch (e) {} }
  });
</script>
</body>
</html>
