<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>الرئيسية — منصة أواب الإلكترونية</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header" id="appHeader"></header>

<main class="page">
  <div class="home-hero">
    <div class="hero-greet">
      <div class="hero-greet-text">
        <h1 id="heroGreetName">أهلًا بك 👋</h1>
        <p>استمر في رحلتك التعليمية، وكل خطوة بتقرّبك من هدفك بإذن الله</p>
      </div>
      <div class="hero-mini-tier" id="heroMiniTier"></div>
    </div>
    <div class="hero-cta-row">
      <button type="button" class="btn btn-primary" id="heroCtaLearn">ابدأ التعلم</button>
      <button type="button" class="btn btn-outline" id="heroCtaCompetitions">المسابقات</button>
    </div>
  </div>

  <div class="ayah-banner" id="ayahBanner"></div>

  <section class="continue-section" id="continueSection" style="display:none;">
    <h2 class="section-title">استكمل من حيث توقفت</h2>
    <div id="continueList"></div>
  </section>

  <div class="search-bar-wrap" id="searchBarWrap">
    <div class="search-bar">
      <span class="search-icon"></span>
      <input type="text" id="searchInput" placeholder="ابحث عن كورس أو مسابقة..." autocomplete="off">
      <button type="button" class="search-clear-btn" id="searchClearBtn" aria-label="مسح البحث"></button>
    </div>
    <div class="search-suggestions" id="searchSuggestions"></div>
  </div>

  <div class="content-head">
    <h2 class="section-title">كل المحتوى التعليمي</h2>
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">الكل</button>
      <button class="filter-tab" data-filter="course">كورسات</button>
      <button class="filter-tab" data-filter="competition">مسابقات</button>
    </div>
  </div>

  <div id="content">
    <div class="skeleton-grid">
      <div class="skeleton-card"><div class="skeleton sk-cover"></div><div class="sk-body"><div class="skeleton sk-line w-70"></div><div class="skeleton sk-line w-40"></div><div class="skeleton sk-btn"></div></div></div>
      <div class="skeleton-card"><div class="skeleton sk-cover"></div><div class="sk-body"><div class="skeleton sk-line w-70"></div><div class="skeleton sk-line w-40"></div><div class="skeleton sk-btn"></div></div></div>
      <div class="skeleton-card"><div class="skeleton sk-cover"></div><div class="sk-body"><div class="skeleton sk-line w-70"></div><div class="skeleton sk-line w-40"></div><div class="skeleton sk-btn"></div></div></div>
    </div>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<!-- ===== Firebase + Libraries ===== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js"></script>

<!-- ===== app-shell.js ===== -->
<script src="app-shell.js"></script>

<!-- ===== الصفحة الرئيسية ===== -->
<script>
  (function() {
    const content = document.getElementById('content');
    let currentFilter = 'all';
    let currentSearch = '';
    let cachedFiltered = {};
    let cachedEnrolls = {};
    let cachedProgress = {};

    document.querySelector('#searchBarWrap .search-icon').innerHTML = icon('search', 'icon-sm');
    document.getElementById('searchClearBtn').innerHTML = icon('xmark');

    const AYAHS = [
      { text: 'وَقُل رَّبِّ زِدْنِي عِلْمًا', ref: 'سورة طه: 114' },
      { text: 'إِنَّمَا يَخْشَى اللَّهَ مِنْ عِبَادِهِ الْعُلَمَاءُ', ref: 'سورة فاطر: 28' },
      { text: 'مَن سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ', ref: 'حديث شريف — رواه مسلم' },
      { text: 'وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا', ref: 'سورة الطلاق: 2' },
      { text: 'إِنَّ مَعَ الْعُسْرِ يُسْرًا', ref: 'سورة الشرح: 6' },
      { text: 'طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ', ref: 'حديث شريف — رواه ابن ماجه' }
    ];

    function renderAyah() {
      const a = AYAHS[Math.floor(Math.random() * AYAHS.length)];
      document.getElementById('ayahBanner').innerHTML =
        '<p class="ayah-text">' + escapeHtml(a.text) + '</p>' +
        '<p class="ayah-ref">' + escapeHtml(a.ref) + '</p>';
    }

    function renderHero(userData) {
      const name = (userData.name || 'مستخدم').trim().split(/\s+/)[0];
      document.getElementById('heroGreetName').textContent = 'أهلًا بك، ' + name + ' 👋';

      const tier = getUserTier(userData.points || 0);
      document.getElementById('heroMiniTier').innerHTML =
        '<div class="hmt-icon">' + icon(tier.rank.icon, 'icon-sm') + '</div>' +
        '<div class="hmt-text">' +
          '<div class="hmt-label">' + tier.rank.name + ' • المستوى ' + tier.level + '</div>' +
          '<div class="hmt-value">' + tier.points + ' نقطة</div>' +
        '</div>';
    }

    function showError(msg) {
      content.innerHTML =
        '<div class="empty-state" style="border:2px solid var(--danger); border-radius:var(--radius); padding:30px;">' +
          '<div class="empty-state-icon" style="color:var(--danger);">' + icon('circleXmark', 'icon-xl') + '</div>' +
          '<h3 style="color:var(--danger);">' + msg + '</h3>' +
          '<button class="btn btn-primary btn-sm" onclick="location.reload()" style="width:auto; margin-top:10px;">إعادة المحاولة</button>' +
        '</div>';
    }

    function renderContinueLearning(competitionsData, enrollments, progressByComp) {
      const section = document.getElementById('continueSection');
      const list = document.getElementById('continueList');

      const inProgress = Object.keys(enrollments)
        .filter(function (id) { return competitionsData[id]; })
        .map(function (id) {
          const c = competitionsData[id];
          const lessons = c.lessons || {};
          const pct = computeCourseProgress(lessons, progressByComp[id] || {});
          return { id: id, c: c, pct: pct, enrolledAt: enrollments[id] || 0 };
        })
        .filter(function (item) { return item.pct < 100; })
        .sort(function (a, b) { return b.enrolledAt - a.enrolledAt; })
        .slice(0, 3);

      if (inProgress.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'block';

      list.innerHTML = inProgress.map(function (item) {
        const isCourse = item.c.type !== 'competition';
        return (
          '<a class="enrolled-card" href="competition.html?id=' + encodeURIComponent(item.id) + '">' +
            '<div class="ec-cover">' +
              (item.c.coverUrl ? '<img src="' + escapeHtml(item.c.coverUrl) + '" alt="" loading="lazy">' : icon(isCourse ? 'bookOpen' : 'trophy', 'icon-md')) +
            '</div>' +
            '<div class="ec-body">' +
              '<div class="ec-title">' + escapeHtml(item.c.title || 'بدون عنوان') + '</div>' +
              '<div class="ec-progress-wrap">' +
                '<div class="ec-progress-bar"><div class="ec-progress-fill" style="width:' + item.pct + '%;"></div></div>' +
                '<span class="ec-percent">' + item.pct + '%</span>' +
              '</div>' +
            '</div>' +
            '<span class="btn btn-outline btn-sm" style="width:auto;">' + icon('chevronLeft', 'icon-sm') + '</span>' +
          '</a>'
        );
      }).join('');
    }

    function renderCompetitions(competitionsData, enrollments, progressByComp) {
      const allIds = Object.keys(competitionsData);
      const q = currentSearch.trim().toLowerCase();
      const ids = allIds.filter(function (id) {
        const c = competitionsData[id];
        if (currentFilter !== 'all') {
          const isCourse = c.type !== 'competition';
          if (currentFilter === 'course' ? !isCourse : isCourse) return false;
        }
        if (q && (c.title || '').toLowerCase().indexOf(q) === -1 && (c.description || '').toLowerCase().indexOf(q) === -1) return false;
        return true;
      });

      if (allIds.length === 0) {
        content.innerHTML =
          '<div class="empty-state"><div class="empty-state-icon">' + icon('trophy', 'icon-xl') + '</div>' +
          '<p>لا يوجد محتوى متاح حاليًا، تابعنا قريبًا</p></div>';
        return;
      }
      if (ids.length === 0) {
        content.innerHTML =
          '<div class="empty-state"><div class="empty-state-icon">' + icon('circleInfo', 'icon-xl') + '</div>' +
          '<p>' + (q ? 'مفيش نتائج مطابقة لبحثك' : 'لا يوجد محتوى من هذا النوع حاليًا') + '</p></div>';
        return;
      }

      let html = '<div class="grid">';
      ids.forEach(function (id) {
        const c = competitionsData[id];
        const lessons = c.lessons || {};
        const lessonsCount = Object.keys(lessons).length;
        const isCourse = c.type !== 'competition';
        const typeLabel = isCourse ? 'كورس' : 'مسابقة';
        const typeIcon = isCourse ? 'bookOpen' : 'trophy';
        const isEnrolled = !!enrollments[id];
        const pct = isEnrolled ? computeCourseProgress(lessons, progressByComp[id] || {}) : 0;
        const ctaLabel = isEnrolled ? 'متابعة التعلم' : (isCourse ? 'اشتراك في الكورس' : 'انضمام للمسابقة');
        const isNew = c.createdAt && (Date.now() - c.createdAt) < (7 * 24 * 60 * 60 * 1000);

        html +=
          '<a class="comp-card ' + (isEnrolled ? 'is-enrolled' : '') + '" href="competition.html?id=' + encodeURIComponent(id) + '">' +
            '<div class="cover">' +
              (isNew ? '<span class="badge-new">جديد</span>' : '') +
              '<span class="content-type-badge ' + (isCourse ? 'course' : 'competition') + '">' + icon(typeIcon, 'icon-sm') + ' ' + typeLabel + '</span>' +
              (isEnrolled ? '<span class="enrolled-ribbon">' + icon('check', 'icon-sm') + ' أنت مشترك بالفعل</span>' : '') +
              (c.coverUrl ? '<img src="' + escapeHtml(c.coverUrl) + '" alt="" loading="lazy">' : '<span class="cover-icon">' + icon(typeIcon, 'icon-lg') + '</span>') +
            '</div>' +
            '<div class="body">' +
              '<h3>' + escapeHtml(c.title || 'بدون عنوان') + '</h3>' +
              (c.description ? '<p>' + escapeHtml(truncateText(c.description, 90)) + '</p>' : '') +
              '<div class="meta">' + icon('bookOpen', 'icon-sm') + ' ' + lessonsCount + ' محاضرة</div>' +
              (isEnrolled ?
                '<div class="card-progress-wrap">' +
                  '<div class="card-progress-bar"><div class="card-progress-fill" style="width:' + pct + '%;"></div></div>' +
                  '<span class="card-progress-pct">' + pct + '%</span>' +
                '</div>' : ''
              ) +
              '<span class="btn ' + (isEnrolled ? 'btn-outline' : 'btn-primary') + ' btn-sm" style="margin-top:6px;">' + ctaLabel + '</span>' +
            '</div>' +
          '</a>';
      });
      html += '</div>';
      content.innerHTML = html;
    }

    function setActiveFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(function (b) { b.classList.toggle('active', b.dataset.filter === filter); });
      renderCompetitions(cachedFiltered, cachedEnrolls, cachedProgress);
    }

    document.getElementById('filterTabs').addEventListener('click', function (e) {
      const btn = e.target.closest('.filter-tab');
      if (!btn) return;
      setActiveFilter(btn.dataset.filter);
    });

    document.getElementById('heroCtaLearn').addEventListener('click', function () {
      setActiveFilter('course');
      document.getElementById('content').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.getElementById('heroCtaCompetitions').addEventListener('click', function () {
      setActiveFilter('competition');
      document.getElementById('content').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // ===== شريط البحث =====
    const searchInput = document.getElementById('searchInput');
    const searchBarWrap = document.getElementById('searchBarWrap');
    const searchClearBtn = document.getElementById('searchClearBtn');
    const searchSuggestions = document.getElementById('searchSuggestions');
    let searchDebounce = null;

    function renderSuggestions(q) {
      if (!q) { searchSuggestions.classList.remove('open'); return; }
      const matches = Object.keys(cachedFiltered)
        .filter(function (id) { return (cachedFiltered[id].title || '').toLowerCase().indexOf(q) !== -1; })
        .slice(0, 6);
      if (matches.length === 0) {
        searchSuggestions.innerHTML = '<div class="sug-empty">مفيش نتائج مطابقة</div>';
      } else {
        searchSuggestions.innerHTML = matches.map(function (id) {
          const c = cachedFiltered[id];
          const isCourse = c.type !== 'competition';
          return '<a href="competition.html?id=' + encodeURIComponent(id) + '">' + icon(isCourse ? 'bookOpen' : 'trophy', 'icon-sm') + ' ' + escapeHtml(c.title || '') + '</a>';
        }).join('');
      }
      searchSuggestions.classList.add('open');
    }

    searchInput.addEventListener('input', function () {
      const val = searchInput.value;
      searchBarWrap.classList.toggle('has-value', val.length > 0);
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(function () {
        currentSearch = val;
        renderCompetitions(cachedFiltered, cachedEnrolls, cachedProgress);
        renderSuggestions(val.trim().toLowerCase());
      }, 180);
    });
    searchInput.addEventListener('focus', function () {
      if (searchInput.value.trim()) renderSuggestions(searchInput.value.trim().toLowerCase());
    });
    searchClearBtn.addEventListener('click', function () {
      searchInput.value = '';
      currentSearch = '';
      searchBarWrap.classList.remove('has-value');
      searchSuggestions.classList.remove('open');
      renderCompetitions(cachedFiltered, cachedEnrolls, cachedProgress);
      searchInput.focus();
    });
    document.addEventListener('click', function (e) {
      if (!searchBarWrap.contains(e.target)) searchSuggestions.classList.remove('open');
    });

    function truncateText(text, max) {
      if (!text || text.length <= max) return text;
      return text.slice(0, max).trim() + '…';
    }

    // ===== بدء التشغيل =====
    auth.onAuthStateChanged(function(user) {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      // 1. جلب بيانات المستخدم
      db.ref('users/' + user.uid).once('value')
        .then(function(snap) {
          let userData = snap.val();
          if (!userData) {
            userData = {
              name: user.displayName || 'مستخدم',
              email: user.email || '',
              points: 0,
              isAdmin: false,
              createdAt: firebase.database.ServerValue.TIMESTAMP
            };
            db.ref('users/' + user.uid).set(userData).catch(function(e) {
              console.warn('فشل حفظ بيانات المستخدم:', e);
            });
          }
          // عرض الهيدر والفوتر
          renderAppHeader(user, userData, { showPoints: true });
          renderFooter();
          watchSessionKick(user);
          renderHero(userData);
          renderAyah();

          // 2. تحميل المحتوى
          return Promise.all([
            db.ref('competitions').once('value'),
            db.ref('userEnrollments/' + user.uid).once('value'),
            db.ref('userProgress/' + user.uid).once('value')
          ]);
        })
        .then(function(results) {
          const allData = results[0].val() || {};
          const enrolls = results[1].val() || {};
          const progress = results[2].val() || {};

          // تصفية العناصر التي تحتوي على محتوى فعلي
          const filtered = {};
          Object.keys(allData).forEach(id => {
            const comp = allData[id];
            const lessons = comp.lessons || {};
            let hasContent = false;
            Object.keys(lessons).forEach(lid => {
              const lesson = lessons[lid];
              if (lesson.videos && Object.keys(lesson.videos).length > 0) hasContent = true;
              if (lesson.exams && Object.keys(lesson.exams).length > 0) hasContent = true;
            });
            if (hasContent) filtered[id] = comp;
          });

          cachedFiltered = filtered;
          cachedEnrolls = enrolls;
          cachedProgress = progress;

          renderContinueLearning(filtered, enrolls, progress);
          renderCompetitions(filtered, enrolls, progress);
        })
        .catch(function(err) {
          console.error('خطأ في تحميل المحتوى:', err);
          showError('تعذر تحميل المحتوى: ' + (err.message || 'خطأ غير معروف'));
        });
    });
  })();
</script>
</body>
</html>
