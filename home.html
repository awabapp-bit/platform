<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>الرئيسية — منصة أواب الإلكترونية</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="shell.css?v=1">
<link rel="stylesheet" href="home.css?v=1">
</head>
<body>

<header class="ah-bar" id="appHeader"></header>

<main class="hm">

  <!-- ===== الترحيب والمستوى ===== -->
  <section class="hm-top">
    <div class="hm-greet">
      <h1 id="hmGreet">أهلًا بك</h1>
      <p class="hm-ayah" id="hmAyah"></p>
    </div>
    <a class="hm-tier" id="hmTier" href="account.html" hidden></a>
  </section>

  <!-- ===== تابع من حيث توقفت + نشاط الأسبوع ===== -->
  <section class="hm-stage solo" id="hmStage">
    <div class="hm-sk hero"></div>
  </section>

  <!-- ===== نقطة النزول من البحث في الهيدر ===== -->
  <div id="coursesSection"></div>
  <!-- شريط البحث المعتمد هو اللي في الهيدر فقط؛ الحقل ده مخفي وبيُستخدم داخليًا لتوصيل كلمة البحث لمنطق الفلترة هنا -->
  <input type="hidden" id="searchInput">

  <div id="content">
    <div class="hm-grid">
      <div class="hm-sk card"></div><div class="hm-sk card"></div><div class="hm-sk card"></div>
    </div>
  </div>
</main>

<footer class="sf-footer" id="siteFooter"></footer>

<!-- ===== Firebase + Libraries ===== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js?v=2"></script>

<!-- ===== app-shell.js ===== -->
<script src="app-shell.js?v=3"></script>

<!-- ===== الصفحة الرئيسية ===== -->
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var content = $('content');
  var stage = $('hmStage');

  var currentFilter = 'all';
  var searchQuery = '';
  var DATA = { comps: {}, enrolls: {}, progress: {} };
  var model = null; // الحسابات المشتقة بعد التحميل

  function ic(name) { return icon(name, 'hm-ic'); }
  function truncateText(text, max) {
    if (!text || text.length <= max) return text;
    return text.slice(0, max).trim() + '…';
  }

  /* ===== آية / حديث أعلى الصفحة ===== */
  var AYAHS = [
    { text: 'وَقُل رَّبِّ زِدْنِي عِلْمًا', ref: 'سورة طه: 114' },
    { text: 'إِنَّمَا يَخْشَى اللَّهَ مِنْ عِبَادِهِ الْعُلَمَاءُ', ref: 'سورة فاطر: 28' },
    { text: 'مَن سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ', ref: 'رواه مسلم' },
    { text: 'وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا', ref: 'سورة الطلاق: 2' },
    { text: 'إِنَّ مَعَ الْعُسْرِ يُسْرًا', ref: 'سورة الشرح: 6' },
    { text: 'طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ', ref: 'رواه ابن ماجه' }
  ];
  function renderAyah() {
    var a = AYAHS[Math.floor(Math.random() * AYAHS.length)];
    $('hmAyah').innerHTML = escapeHtml(a.text) + '<small>' + escapeHtml(a.ref) + '</small>';
  }

  /* ===== الترحيب + بطاقة المستوى ===== */
  function renderTop(userData) {
    var first = (userData.name || 'مستخدم').trim().split(/\s+/)[0];
    $('hmGreet').textContent = 'أهلًا بك، ' + first;

    var tier = getUserTier(userData.points || 0);
    var next = tier.isMax
      ? 'وصلت إلى أعلى مستوى'
      : tier.pointsToNext + ' نقطة للمستوى ' + (tier.level + 1);
    var el = $('hmTier');
    el.innerHTML =
      '<div class="hm-tier-row">' +
        '<span class="hm-tier-name">' + ic(tier.rank.icon) + tier.rank.name + ' · المستوى ' + tier.level + '</span>' +
        '<span class="hm-tier-pts">' + tier.points + '<small>نقطة</small></span>' +
      '</div>' +
      '<div class="hm-tier-bar"><i></i></div>' +
      '<div class="hm-tier-next">' + next + '</div>';
    el.hidden = false;
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      el.querySelector('.hm-tier-bar i').style.width = tier.progress + '%';
    }); });
  }

  /* ===== الحسابات: تقدّم كل كورس + إحصائيات الأسبوع ===== */
  function buildModel(comps, enrolls, progress) {
    var mine = [], videosWatched = 0, examTimestamps = [];

    Object.keys(enrolls).forEach(function (id) {
      var c = comps[id];
      if (!c) return;
      var lessons = c.lessons || {};
      var prog = progress[id] || {};
      var lessonIds = Object.keys(lessons);
      var lectureIds = getLectureIds(lessons); /* دروس الملفات فقط مش بتتحسب كمحاضرات */
      var done = 0, lastActivity = 0;

      lessonIds.forEach(function (lid) {
        var lp = prog[lid] || {};
        if (lp.completed && isLectureLesson(lessons[lid])) done++;
        var videos = lp.videos || {};
        Object.keys(videos).forEach(function (vid) {
          if (videos[vid] && videos[vid].watched) videosWatched++;
        });
        var exams = lp.exams || {};
        Object.keys(exams).forEach(function (eid) {
          var ex = exams[eid];
          if (ex && ex.answeredAt) {
            examTimestamps.push(ex.answeredAt);
            if (ex.answeredAt > lastActivity) lastActivity = ex.answeredAt;
          }
        });
      });

      mine.push({
        id: id, comp: c,
        total: lectureIds.length, done: done,
        pct: computeCourseProgress(lessons, prog),
        lastActivity: lastActivity
      });
    });

    var completed = mine.filter(function (m) { return m.pct >= 100; }).length;
    var inProgress = mine.filter(function (m) { return m.pct < 100; });
    /* الأحدث نشاطًا أولًا، ثم الأعلى تقدّمًا */
    inProgress.sort(function (a, b) { return (b.lastActivity - a.lastActivity) || (b.pct - a.pct); });

    return {
      mine: mine,
      focus: inProgress[0] || null,
      completed: completed,
      current: inProgress.length,
      videos: videosWatched,
      exams: examTimestamps
    };
  }

  /* ===== بطاقة "تابع من حيث توقفت" ===== */
  var ARCH_D = 'M112 152V62A52 52 0 0 0 8 62V152';

  function archHtml(valueHtml) {
    return '<div class="hm-arch" aria-hidden="true">' +
      '<svg viewBox="0 0 120 156"><path class="track" pathLength="1" d="' + ARCH_D + '"/><path class="fill" id="hmArchFill" pathLength="1" d="' + ARCH_D + '"/></svg>' +
      '<div class="hm-arch-val">' + valueHtml + '</div></div>';
  }

  function hasAvailable() {
    return Object.keys(DATA.comps).some(function (id) { return !DATA.enrolls[id]; });
  }

  function renderHero() {
    var f = model.focus, html, pct = 0;

    if (f) {
      pct = f.pct;
      var by = f.comp.instructorName ? ' مع ' + escapeHtml(f.comp.instructorName) : '';
      html =
        '<div class="hm-continue">' +
          '<div>' +
            '<p class="hm-kicker">تابع من حيث توقفت</p>' +
            '<h2>' + escapeHtml(f.comp.title || 'بدون عنوان') + '</h2>' +
            '<p class="hm-sub">أنهيت <b>' + f.done + '</b> من <b>' + f.total + '</b> محاضرة' + by + '.</p>' +
            '<a class="hm-btn" href="competition.html?id=' + encodeURIComponent(f.id) + '">متابعة التعلم ' + ic('chevronLeft') + '</a>' +
          '</div>' +
          archHtml(f.pct + '%<small>من المحتوى</small>') +
        '</div>';
    } else if (model.mine.length) {
      html =
        '<div class="hm-continue">' +
          '<div>' +
            '<p class="hm-kicker">أحسنت</p>' +
            '<h2>أنهيت كل ما اشتركت فيه</h2>' +
            '<p class="hm-sub">' + (hasAvailable() ? 'اختر محتوى جديدًا لتكمل رحلتك.' : 'سنخبرك فور إضافة محتوى جديد.') + '</p>' +
            (hasAvailable() ? '<button type="button" class="hm-btn" data-scroll="1">اكتشف المزيد</button>' : '') +
          '</div>' +
          archHtml(ic('circleCheck')) +
        '</div>';
      pct = 100;
    } else {
      var any = Object.keys(DATA.comps).length > 0;
      html =
        '<div class="hm-continue">' +
          '<div>' +
            '<p class="hm-kicker">ابدأ رحلتك</p>' +
            '<h2>اختر أول كورس لك</h2>' +
            '<p class="hm-sub">' + (any ? 'اشترك في كورس وابدأ أول محاضرة، وسيظهر تقدّمك هنا.' : 'لا يوجد محتوى متاح حاليًا، تابعنا قريبًا.') + '</p>' +
            (any ? '<button type="button" class="hm-btn" data-scroll="1">تصفّح المحتوى</button>' : '') +
          '</div>' +
          archHtml(ic('bookOpen')) +
        '</div>';
    }

    var week = model.mine.length ? weekHtml() : '';
    stage.className = 'hm-stage' + (week ? '' : ' solo');
    stage.innerHTML = html + week;

    var btn = stage.querySelector('[data-scroll]');
    if (btn) btn.addEventListener('click', function () {
      $('coursesSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    var fill = $('hmArchFill');
    if (fill) requestAnimationFrame(function () { requestAnimationFrame(function () {
      fill.style.strokeDashoffset = String(1 - pct / 100);
    }); });
  }

  /* ===== نشاط الأسبوع (من مواعيد حل الاختبارات الفعلية) ===== */
  function weekHtml() {
    var DAY_SHORT = ['س', 'ح', 'ن', 'ث', 'ر', 'خ', 'ج'];
    var DAY_FULL = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];
    function satIndex(d) { return (d.getDay() + 1) % 7; } // السبت = 0 ... الجمعة = 6

    var now = new Date();
    var today = satIndex(now);
    var startThis = new Date(now); startThis.setHours(0, 0, 0, 0); startThis.setDate(now.getDate() - today);
    var startLast = new Date(startThis); startLast.setDate(startThis.getDate() - 7);

    var curr = [0, 0, 0, 0, 0, 0, 0], prev = [0, 0, 0, 0, 0, 0, 0];
    model.exams.forEach(function (ts) {
      var d = new Date(ts), i = satIndex(d);
      if (d >= startThis) curr[i]++; else if (d >= startLast) prev[i]++;
    });
    var max = Math.max(1, Math.max.apply(null, curr), Math.max.apply(null, prev));
    function h(v) { return v === 0 ? '3px' : Math.max(8, Math.round(v / max * 100)) + '%'; }

    var bars = '', days = '';
    for (var i = 0; i < 7; i++) {
      var cls = i === today ? ' today' : '';
      bars += '<div class="hm-bar' + cls + '" title="' + DAY_FULL[i] + ': ' + curr[i] + ' هذا الأسبوع، ' + prev[i] + ' الأسبوع الماضي">' +
        '<i class="prev" style="height:' + h(prev[i]) + '"></i><i class="curr" style="height:' + h(curr[i]) + '"></i></div>';
      days += '<span class="' + cls.trim() + '">' + DAY_SHORT[i] + '</span>';
    }

    return '<aside class="hm-week">' +
      '<h3>أسبوعك</h3>' +
      '<p>' + (model.exams.length ? 'الاختبارات التي حللتها خلال آخر أسبوعين' : 'لا نشاط بعد. حل أول اختبار ليظهر هنا.') + '</p>' +
      '<div class="hm-bars">' + bars + '</div>' +
      '<div class="hm-days">' + days + '</div>' +
      '<div class="hm-legend"><span><b style="background:#7FD9CF"></b>هذا الأسبوع</span><span><b style="background:#E4EBF2"></b>الأسبوع الماضي</span></div>' +
      '<div class="hm-nums">' +
        '<div class="hm-num"><b>' + model.completed + '</b><span>كورسات مكتملة</span></div>' +
        '<div class="hm-num"><b>' + model.current + '</b><span>كورسات جارية</span></div>' +
        '<div class="hm-num"><b>' + model.videos + '</b><span>فيديوهات شاهدتها</span></div>' +
      '</div>' +
    '</aside>';
  }

  /* ===== المحتوى: كورساتي + المتاح ===== */
  function matches(c) {
    var q = searchQuery.trim().toLowerCase();
    if (!q) return true;
    return ((c.title || '') + ' ' + (c.description || '')).toLowerCase().indexOf(q) !== -1;
  }
  function passesFilter(c) {
    if (currentFilter === 'all') return true;
    var isCourse = c.type !== 'competition';
    return currentFilter === 'course' ? isCourse : !isCourse;
  }

  function coverHtml(c, isCourse) {
    var typeIcon = isCourse ? 'bookOpen' : 'trophy';
    return '<div class="hm-cover-ph">' +
        '<svg class="hm-a" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
          '<path d="M110 180V95A50 50 0 0 1 210 95V180"/><path d="M85 180V95A75 75 0 0 1 235 95V180" stroke-opacity=".5"/></svg>' +
        ic(typeIcon) +
      '</div>' +
      (c.coverUrl ? '<img src="' + escapeHtml(c.coverUrl) + '" alt="" loading="lazy" onerror="this.remove()">' : '');
  }

  function mineRow(m) {
    var c = m.comp, isCourse = c.type !== 'competition';
    var by = c.instructorName ? ' · ' + escapeHtml(c.instructorName) : '';
    var thumb = c.coverUrl
      ? '<img src="' + escapeHtml(c.coverUrl) + '" alt="" loading="lazy" onerror="this.remove()">'
      : ic(isCourse ? 'bookOpen' : 'trophy');
    return '<a class="hm-row" href="competition.html?id=' + encodeURIComponent(m.id) + '">' +
      '<div class="hm-thumb">' + thumb + '</div>' +
      '<div class="hm-row-body">' +
        '<h3>' + escapeHtml(c.title || 'بدون عنوان') + '</h3>' +
        '<div class="hm-row-meta">' + m.done + ' من ' + m.total + ' محاضرة' + by + '</div>' +
        '<div class="hm-prog"><div class="hm-prog-bar"><i style="width:' + m.pct + '%"></i></div><b>' + m.pct + '%</b></div>' +
      '</div></a>';
  }

  function catalogCard(id, c) {
    var isCourse = c.type !== 'competition';
    var lessonsCount = countLectures(c.lessons || {});
    var isNew = c.createdAt && (Date.now() - c.createdAt) < (7 * 24 * 60 * 60 * 1000);
    return '<a class="hm-card" href="competition.html?id=' + encodeURIComponent(id) + '">' +
      '<div class="hm-cover">' + coverHtml(c, isCourse) +
        '<span class="hm-tag">' + ic(isCourse ? 'bookOpen' : 'trophy') + (isCourse ? 'كورس' : 'مسابقة') + '</span>' +
        (isNew ? '<span class="hm-tag new">جديد</span>' : '') +
      '</div>' +
      '<div class="hm-card-body">' +
        '<h3>' + escapeHtml(c.title || 'بدون عنوان') + '</h3>' +
        (c.description ? '<p>' + escapeHtml(truncateText(c.description, 120)) + '</p>' : '') +
        '<div class="hm-meta">' +
          '<span>' + ic('bookOpen') + lessonsCount + ' محاضرة</span>' +
          (c.instructorName ? '<span>' + ic('graduationCap') + escapeHtml(c.instructorName) + '</span>' : '') +
        '</div>' +
        '<div class="hm-go"><span>' + (isCourse ? 'اشترك في الكورس' : 'انضم للمسابقة') + '</span>' + ic('chevronLeft') + '</div>' +
      '</div></a>';
  }

  function renderContent() {
    if (!model) return;
    var q = searchQuery.trim();
    var allIds = Object.keys(DATA.comps);

    if (allIds.length === 0) {
      content.innerHTML = '<div class="hm-empty">' + ic('trophy') + 'لا يوجد محتوى متاح حاليًا، تابعنا قريبًا.</div>';
      return;
    }

    var mineList = model.mine.filter(function (m) { return matches(m.comp); });
    var catalogIds = allIds.filter(function (id) {
      return !DATA.enrolls[id] && passesFilter(DATA.comps[id]) && matches(DATA.comps[id]);
    });

    var html = '';
    if (q) {
      html += '<div class="hm-searchline"><span>نتائج البحث عن «' + escapeHtml(q) + '»</span>' +
        '<button type="button" id="hmClear">مسح البحث</button></div>';
    }

    if (mineList.length) {
      html += '<section class="hm-sec"><div class="hm-head"><h2>كورساتي<small>' + mineList.length + '</small></h2></div>' +
        '<div class="hm-mine">' + mineList.map(mineRow).join('') + '</div></section>';
    }

    var catTitle = model.mine.length ? 'اكتشف المزيد' : 'المحتوى التعليمي';
    html += '<section class="hm-sec"><div class="hm-head"><h2>' + catTitle + '</h2>' +
      '<div class="hm-tabs" id="hmTabs">' +
        ['all:الكل', 'course:كورسات', 'competition:مسابقات'].map(function (t) {
          var p = t.split(':');
          return '<button type="button" class="hm-tab' + (p[0] === currentFilter ? ' active' : '') + '" data-filter="' + p[0] + '">' + p[1] + '</button>';
        }).join('') +
      '</div></div>';

    if (catalogIds.length) {
      html += '<div class="hm-grid">' + catalogIds.map(function (id) { return catalogCard(id, DATA.comps[id]); }).join('') + '</div>';
    } else if (q) {
      html += mineList.length ? '' : '<div class="hm-empty">' + ic('search') + 'لا توجد نتائج تطابق «' + escapeHtml(q) + '».<br><button type="button" class="hm-btn" id="hmClear2">مسح البحث</button></div>';
    } else if (model.mine.length && currentFilter === 'all') {
      html += '<div class="hm-empty">' + ic('circleCheck') + 'أنت مشترك في كل المحتوى المتاح حاليًا.</div>';
    } else {
      html += '<div class="hm-empty">' + ic('circleInfo') + 'لا يوجد محتوى من هذا النوع حاليًا.</div>';
    }
    html += '</section>';

    content.innerHTML = html;
    ['hmClear', 'hmClear2'].forEach(function (id) {
      var b = $(id); if (b) b.addEventListener('click', resetSearch);
    });
  }

  content.addEventListener('click', function (e) {
    var btn = e.target.closest('.hm-tab');
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    renderContent();
  });

  /* ===== البحث: شريط الهيدر هو المعتمد، وهنا منطق الفلترة فقط ===== */
  var searchInputEl = $('searchInput');

  function resetSearch() {
    searchQuery = '';
    searchInputEl.value = '';
    var headerInput = $('headerSearchInput');
    if (headerInput) headerInput.value = '';
    renderContent();
  }
  searchInputEl.addEventListener('input', function () {
    searchQuery = searchInputEl.value;
    renderContent();
  });

  /* لو جاي من صفحة تانية ببحث (?q=...) هات القيمة واعرضها فورًا */
  var initialQuery = new URLSearchParams(location.search).get('q');
  if (initialQuery) { searchQuery = initialQuery; searchInputEl.value = initialQuery; }

  function showError(msg) {
    stage.style.display = 'none';
    content.innerHTML = '<div class="hm-empty err">' + ic('circleXmark') + escapeHtml(msg) +
      '<br><button type="button" class="hm-btn" onclick="location.reload()">إعادة المحاولة</button></div>';
  }

  // ===== بدء التشغيل =====
  auth.onAuthStateChanged(function (user) {
    if (!user) { window.location.href = 'index.html'; return; }

    // 1. جلب بيانات المستخدم
    db.ref('users/' + user.uid).once('value')
      .then(function (snap) {
        var userData = snap.val();
        if (!userData) {
          userData = {
            name: user.displayName || 'مستخدم',
            email: user.email || '',
            points: 0,
            isAdmin: false,
            createdAt: firebase.database.ServerValue.TIMESTAMP
          };
          db.ref('users/' + user.uid).set(userData).catch(function (e) {
            console.warn('فشل حفظ بيانات المستخدم:', e);
          });
        }
        // عرض الهيدر والفوتر
        renderAppHeader(user, userData, { showPoints: true });
        renderFooter();
        watchSessionKick(user);
        renderTop(userData);
        renderAyah();

        // لو الاسم مسجّل بالإنجليزية، اعرض رسالة إجبارية لتغييره للعربية
        var needsArabicName = window.hasEnglishName && hasEnglishName(userData.name);
        if (needsArabicName) setTimeout(showArabicNameNotice, 400);

        // لو معندوش رقم هاتف مسجّل، اعرض له دعوة اختيارية لإضافته (إلا لو فيه رسالة الاسم الإجبارية ظاهرة الأول)
        if (!userData.phone && !needsArabicName) {
          setTimeout(function () { showAddPhoneNotice(user, userData); }, 600);
        }

        // 2. تحميل المحتوى
        return Promise.all([
          db.ref('competitions').once('value'),
          db.ref('userEnrollments/' + user.uid).once('value'),
          db.ref('userProgress/' + user.uid).once('value')
        ]);
      })
      .then(function (results) {
        var allData = results[0].val() || {};
        var enrolls = results[1].val() || {};
        var progress = results[2].val() || {};

        // تصفية العناصر التي تحتوي على محتوى فعلي
        var filtered = {};
        Object.keys(allData).forEach(function (id) {
          var lessons = allData[id].lessons || {};
          var hasContent = false;
          Object.keys(lessons).forEach(function (lid) {
            var l = lessons[lid];
            if (l.videos && Object.keys(l.videos).length > 0) hasContent = true;
            if (l.exams && Object.keys(l.exams).length > 0) hasContent = true;
          });
          if (hasContent) filtered[id] = allData[id];
        });

        DATA = { comps: filtered, enrolls: enrolls, progress: progress };
        model = buildModel(filtered, enrolls, progress);
        renderHero();
        renderContent();

        if (initialQuery) {
          setTimeout(function () {
            $('coursesSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 200);
        }
      })
      .catch(function (err) {
        console.error('خطأ في تحميل المحتوى:', err);
        showError('تعذر تحميل المحتوى: ' + (err.message || 'خطأ غير معروف'));
      });
  });
})();
</script>
</body>
</html>
