<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>الاختبار — منصة أواب الإلكترونية</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="shell.css?v=1">
<link rel="stylesheet" href="lesson-ui.css?v=1">
</head>
<body>

<header class="ah-bar" id="appHeader"></header>

<main class="xq-page">
  <div class="xq-head">
    <a class="xq-back" id="backLink" href="competition.html" aria-label="رجوع للمحاضرة"></a>
    <h1 class="xq-title" id="examTitle">جارٍ التحميل...</h1>
    <div class="xq-timer" id="examTimer">
      <span id="timerIcon"></span>
      <span id="timerDisplay">00:00</span>
    </div>
  </div>

  <div class="xq-banner is-danger" id="violationWarning">
    <span class="xq-banner-icon"></span>
    <span>مخالفات: <b id="violationCount">0</b> من <b id="maxViolations">3</b> — تجاوز الحد يسلّم الاختبار تلقائياً.</span>
  </div>
  <div class="xq-banner is-info" id="reloadWarning">
    <span class="xq-banner-icon"></span>
    <span>إعادة تحميل الصفحة <b id="reloadCountDisplay">0</b> من <b id="maxReloads">10</b>. إجاباتك محفوظة تلقائيًا.</span>
  </div>

  <div id="content">
    <div class="center-loading"><div class="loader"></div></div>
  </div>
</main>

<div class="xq-sheet-overlay" id="confirmOverlay">
  <div class="xq-sheet">
    <div class="ui-state-icon" id="confirmIcon"></div>
    <h3>تسليم الاختبار؟</h3>
    <p>لن تتمكن من تعديل إجاباتك بعد التسليم.</p>
    <div class="xq-sheet-actions">
      <button class="ui-btn ui-btn-accent" id="confirmYesBtn">نعم، سلّم</button>
      <button class="ui-btn ui-btn-soft" id="confirmNoBtn">رجوع</button>
    </div>
  </div>
</div>

<div class="xq-sheet-overlay" id="protectionOverlay">
  <div class="xq-sheet">
    <div class="ui-state-icon" id="protectIcon" style="background:#FBEAE6;color:var(--danger);"></div>
    <h3 id="protectionMsg">تم اكتشاف مخالفة</h3>
    <p id="protectionDetail">الرجاء العودة للاختبار فوراً.</p>
    <button class="ui-btn ui-btn-primary ui-btn-block" id="returnToExamBtn">العودة للاختبار</button>
  </div>
</div>

<footer class="sf-footer" id="siteFooter"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js?v=2"></script>
<script src="app-shell.js?v=3"></script>
<script>
  // ============================================================
  // exam.html — صفحة الاختبار مع منع إعادة المحاولة
  // ============================================================

  const params = new URLSearchParams(window.location.search);
  const compId = params.get('comp');
  const lessonId = params.get('lesson');
  const examId = params.get('exam');
  if (!compId || !lessonId || !examId) window.location.href = 'home.html';

  document.getElementById('backLink').href = 'competition.html?id=' + encodeURIComponent(compId);
  document.getElementById('backLink').innerHTML = icon('arrowRight');
  document.getElementById('timerIcon').innerHTML = icon('hourglass');
  document.getElementById('confirmIcon').innerHTML = icon('paperPlane');
  document.getElementById('protectIcon').innerHTML = icon('shield');
  document.querySelectorAll('.xq-banner-icon').forEach(function (el, i) { el.innerHTML = icon(i === 0 ? 'shield' : 'rotateLeft'); });

  let currentUser = null;
  let currentUserData = null;
  let compData = null;
  let examData = null;
  let lessonData = null;
  let userAnswers = {};
  let currentQuestionIndex = 0;
  let questionIds = [];
  let questionsData = [];
  let timerInterval = null;
  let startTime = Date.now();
  let examDuration = 10;
  let isSubmitted = false;
  let isForceEnded = false;
  let violationCount = 0;
  const MAX_VIOLATIONS_KEY = 'maxViolations';
  let maxViolations = 3;
  let reloadCount = 0;
  const MAX_RELOADS = 10;
  let sessionCheckInterval = null;
  let isTabActive = true;

  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmYesBtn = document.getElementById('confirmYesBtn');
  const confirmNoBtn = document.getElementById('confirmNoBtn');

  function showConfirm() { confirmOverlay.classList.add('open'); }
  function hideConfirm() { confirmOverlay.classList.remove('open'); }

  confirmNoBtn.addEventListener('click', hideConfirm);
  confirmOverlay.addEventListener('click', function (e) {
    if (e.target === this) hideConfirm();
  });

  requireAuth(function (user, userData) {
    currentUser = user;
    currentUserData = userData;
    renderAppHeader(user, userData, { showPoints: true });
    renderFooter();

    db.ref('settings/' + MAX_VIOLATIONS_KEY).once('value').then(function(snap) {
      if (snap.exists()) maxViolations = snap.val();
      document.getElementById('maxViolations').textContent = maxViolations;
    });

    const savedSession = localStorage.getItem('awab_session_id');
    if (!savedSession) {
      // أول مرة يفتح فيها المستخدم اختبار على هذا الجهاز: لازم ننتظر إنشاء
      // الجلسة وحفظها محليًا الأول، وبعدين نتحقق منها. لو استنينا واتحققنا
      // في نفس الوقت (بدون انتظار) هيحصل تعارض توقيت وهيفشل التحقق ظلمًا
      // ويطرد المستخدم برسالة "جهاز آخر" رغم إنه نفس الجهاز.
      startSession(user, navigator.userAgent).then(function(newSessionId) {
        localStorage.setItem('awab_session_id', newSessionId);
        load();
      }).catch(function(err) {
        console.error(err);
        window.location.href = 'home.html';
      });
    } else {
      load();
    }
  });

  function load() {
    checkSession(currentUser).then(function(result) {
      if (!result.valid) {
        alert('تم تسجيل الدخول من جهاز آخر. سيتم إنهاء الاختبار.');
        window.location.href = 'home.html';
        return;
      }
      return loadExamData();
    }).catch(function(err) {
      console.error(err);
      window.location.href = 'home.html';
    });
  }

  function loadExamData() {
    db.ref('competitions/' + compId).once('value').then(function (snap) {
      if (!snap.exists()) { window.location.href = 'home.html'; return; }
      compData = snap.val();
      const lessons = compData.lessons || {};
      lessonData = lessons[lessonId];
      if (!lessonData || !lessonData.exams || !lessonData.exams[examId]) {
        window.location.href = 'competition.html?id=' + encodeURIComponent(compId);
        return;
      }

      return db.ref('userEnrollments/' + currentUser.uid + '/' + compId).once('value').then(function (eSnap) {
        if (!eSnap.exists()) {
          document.getElementById('examTitle').textContent = 'محتوى مغلق';
          document.getElementById('content').innerHTML = stateCard('lock', 'لازم تشترك أولاً', 'اشترك في هذا المحتوى من صفحته للوصول لهذا الاختبار.', true);
          return;
        }
        return loadWithAccess();
      });
    });
  }

  function loadWithAccess() {
    db.ref('userProgress/' + currentUser.uid + '/' + compId).once('value').then(function (pSnap) {
      const progressData = pSnap.val() || {};
      const access = getLessonAccessState(compData.lessons || {}, progressData, lessonId);
      const content = document.getElementById('content');
      examData = lessonData.exams[examId];
      document.getElementById('examTitle').textContent = examData.title || 'الاختبار';

      if (!access.allowed) {
        const reasonText = access.reason === 'release' ? 'هذه المحاضرة لم يحن معادها بعد.' : 'أكمِل المحاضرة السابقة أولاً.';
        content.innerHTML = stateCard('lock', 'هذا الاختبار مغلق', reasonText);
        return;
      }

      if (examData.releaseAt && examData.releaseAt > Date.now()) {
        content.innerHTML = stateCard('clock', 'هذا الاختبار مغلق', 'هذا الاختبار لم يحن معاده بعد' + (typeof formatArabicDate === 'function' ? '، يُتاح في ' + formatArabicDate(examData.releaseAt) : '') + '.');
        return;
      }

      // ✅ الخطوة الجديدة: التحقق من وجود محاولة سابقة (حتى لو منتهية)
      // نمنع بدء محاولة جديدة إذا كان هناك أي محاولة سابقة
      db.ref('examAttempts/' + compId + '/' + lessonId + '/' + examId + '/' + currentUser.uid).once('value')
        .then(function(attemptSnap) {
          const attempt = attemptSnap.val();
          if (attempt) {
            // إذا كانت المحاولة موجودة (سواء نشطة أو منتهية)
            if (attempt.submitted === true) {
              // تم تسليمها سابقاً
              showAlreadySubmitted('لقد قمت بتسليم هذا الاختبار مسبقاً. لا يمكنك إعادة المحاولة.');
              return;
            }
            if (attempt.forceEnded === true) {
              // تم إنهاؤها قسرياً
              showAlreadySubmitted('تم إنهاء هذا الاختبار مسبقاً بسبب مخالفات. لا يمكنك إعادة المحاولة.');
              return;
            }
            // إذا كانت المحاولة نشطة (لم تنتهِ)، نستعيدها
            return restoreExam(attempt);
          } else {
            // لا توجد محاولة سابقة، نعرض شاشة التأكيد والتعليمات أولاً
            return showStartScreen();
          }
        })
        .catch(function(err) {
          console.error(err);
          content.innerHTML = stateCard('xmark', 'حدث خطأ', 'تعذر التحقق من المحاولة، حاول مرة أخرى.', false, true);
        });
    });
  }

  // دالة عرض رسالة "تم التسليم مسبقاً" + مراجعة الإجابات بالتفصيل
  function showAlreadySubmitted(message) {
    document.getElementById('examTimer').style.display = 'none';
    document.getElementById('violationWarning').style.display = 'none';
    const content = document.getElementById('content');
    content.innerHTML = '<div class="center-loading"><div class="loader"></div></div>';

    // ✅ مهم: نجيب الأسئلة من محاولة الاختبار الفعلية (examAttempts) مش من بنك الأسئلة الكامل،
    // لأن كل محاولة بتاخد عدد محدد من الأسئلة (questionCount) بترتيب اختيارات عشوائي مختلف.
    // لو جبنا بنك الأسئلة الكامل هيظهر أسئلة زيادة عن اللي اتعرضت فعلاً، وترتيب الاختيارات
    // هيبقى مختلف عن اللي كانت عليه وقت الإجابة، فتظهر إجابات صحيحة على أنها غلط.
    Promise.all([
      db.ref('examAttempts/' + compId + '/' + lessonId + '/' + examId + '/' + currentUser.uid + '/questions').once('value'),
      db.ref('userProgress/' + currentUser.uid + '/' + compId + '/' + lessonId + '/exams/' + examId).once('value')
    ]).then(function (results) {
      const attemptQuestions = results[0].val();
      const progData = results[1].val();

      if (attemptQuestions && attemptQuestions.length && progData && progData.answers) {
        const questionsMap = {};
        const orderedIds = [];
        attemptQuestions.forEach(function (q) {
          if (!q || !q.id) return;
          questionsMap[q.id] = q;
          orderedIds.push(q.id);
        });
        renderExamReview(message, questionsMap, progData, orderedIds);
      } else {
        content.innerHTML = alreadySubmittedFallback(message);
      }
    }).catch(function () {
      content.innerHTML = alreadySubmittedFallback(message);
    });
  }

  function stateCard(iconName, title, text, withLink, danger) {
    return '<div class="ui-state' + (danger ? ' is-danger' : '') + '"><div class="ui-state-icon">' + icon(iconName) + '</div>' +
      '<h3>' + title + '</h3><p>' + text + '</p>' +
      (withLink !== false ? '<a class="ui-btn ui-btn-primary" href="competition.html?id=' + encodeURIComponent(compId) + '">' + (withLink === true ? 'الذهاب لصفحة المحتوى' : 'العودة للمحاضرة') + '</a>' : '') +
      '</div>';
  }

  function alreadySubmittedFallback(message) {
    return stateCard('circleCheck', 'تم التسليم', escapeHtml(message), 'back');
  }

  function correctCountLabel(score, total) { return total ? Math.round((score / total) * 100) : 0; }

  function resultCard(pct, percentage, earnedPoints, correct, total, noteHtml, extraHtml) {
    return '<div class="xq-result">' +
      '<div class="xq-ring" style="--p:' + percentage + '"><div class="xq-ring-inner"><b>' + percentage + '%</b><span>النسبة</span></div></div>' +
      '<div class="xq-points">' + icon('trophy') + ' ' + earnedPoints + ' نقطة</div>' +
      '<p class="xq-result-line">إجابات صحيحة: <b>' + correct + '</b> من <b>' + total + '</b></p>' +
      (noteHtml ? '<p class="xq-result-note is-muted">' + noteHtml + '</p>' : '') + (extraHtml || '') +
      '<a class="ui-btn ui-btn-primary ui-btn-block" href="competition.html?id=' + encodeURIComponent(compId) + '">العودة للمحاضرة</a>' +
    '</div>';
  }

  // ===== عرض مراجعة الإجابات (كل سؤال مع الاختيارات: الصح أخضر، والخطأ المُختار أحمر) =====
  function renderExamReview(message, questionsMap, progData, orderedIds) {
    const content = document.getElementById('content');
    const userAnswers = progData.answers || {};
    const qIds = orderedIds && orderedIds.length ? orderedIds : Object.keys(questionsMap);
    const total = qIds.length;
    const score = progData.score || 0;
    const earnedPoints = progData.earnedPoints || 0;
    const percentage = total ? Math.round((score / total) * 100) : 0;

    const letters = ['أ', 'ب', 'ج', 'د', 'هـ', 'و'];
    let html = resultCard(correctCountLabel(score, total), percentage, earnedPoints, score, total, escapeHtml(message), '');
    html += '<div class="xq-review">';

    qIds.forEach((qId, idx) => {
      const q = questionsMap[qId];
      const selected = userAnswers[qId];
      const hasAnswer = (selected !== undefined && selected !== null && selected >= 0);
      const isCorrect = hasAnswer && selected === q.correct;
      let statusClass = 'unanswered', statusText = 'لم تتم الإجابة';
      if (hasAnswer) { statusClass = isCorrect ? 'correct' : 'wrong'; statusText = isCorrect ? 'صحيحة' : 'خاطئة'; }

      html += '<div class="xq-review-item"><div class="xq-review-head"><p class="xq-review-q">' + (idx + 1) + '. ' + escapeHtml(q.text) + '</p>' +
        '<span class="xq-status ' + statusClass + '">' + statusText + '</span></div><div class="xq-options">';
      (q.options || []).forEach((opt, oi) => {
        let cls = 'xq-option is-static', mark = '';
        if (oi === q.correct) { cls += ' correct'; mark = icon('check'); }
        else if (hasAnswer && oi === selected) { cls += ' wrong'; mark = icon('xmark'); }
        html += '<div class="' + cls + '"><span class="xq-letter">' + (letters[oi] || (oi + 1)) + '</span><span class="xq-opt-text">' + escapeHtml(opt) + '</span><span class="xq-mark">' + mark + '</span></div>';
      });
      html += '</div></div>';
    });
    html += '</div>';

    content.innerHTML = html;
  }

  // ===== شاشة تأكيد بدء الاختبار (تعليمات + مخالفات) =====
  function showStartScreen() {
    document.getElementById('examTimer').style.display = 'none';
    document.getElementById('violationWarning').style.display = 'none';
    document.getElementById('reloadWarning').style.display = 'none';

    const duration = examData.duration || 10;
    const qCount = examData.questionCount || 10;
    const content = document.getElementById('content');

    content.innerHTML =
      '<div class="xq-start">' +
        '<div class="xq-start-hero"><div class="xq-start-icon">' + icon('fileLines') + '</div>' +
          '<h2>جاهز لبدء الاختبار؟</h2>' +
          '<p class="xq-start-sub">اقرأ التعليمات جيداً. العدّاد يبدأ فور الضغط على "ابدأ الاختبار".</p></div>' +
        '<div class="xq-chips">' +
          '<div class="xq-chip">' + icon('listCheck') + '<b>' + qCount + '</b><span>سؤال</span></div>' +
          '<div class="xq-chip">' + icon('clock') + '<b>' + duration + '</b><span>دقيقة</span></div>' +
          '<div class="xq-chip">' + icon('shield') + '<b>' + maxViolations + '</b><span>مخالفات</span></div>' +
        '</div>' +
        '<div class="xq-box"><h3>' + icon('circleInfo') + ' التعليمات</h3><ul>' +
          '<li>العدّاد لا يتوقف حتى تنتهي المدة أو تُسلّم بنفسك.</li>' +
          '<li>تنقّل بين الأسئلة بحرية وأجب بأي ترتيب.</li>' +
          '<li>إجاباتك تُحفظ تلقائياً، ويُسمح بإعادة تحميل الصفحة ' + MAX_RELOADS + ' مرات كحد أقصى.</li>' +
          '<li>لا يمكن تعديل الإجابات أو إعادة الاختبار بعد التسليم.</li>' +
          '<li>أكمل الاختبار من نفس الجهاز والمتصفح، ولا تسجّل دخولك من جهاز آخر.</li>' +
        '</ul></div>' +
        '<div class="xq-box is-danger"><h3>' + icon('circleXmark') + ' مخالفات تُنهي الاختبار</h3>' +
          '<p>عند ' + maxViolations + ' مخالفات يُسلَّم اختبارك تلقائياً ولا تُتاح محاولة أخرى.</p><ul>' +
          '<li>الخروج من الصفحة أو تغيير التبويب</li>' +
          '<li>تصغير المتصفح أو التبديل لتطبيق آخر</li>' +
          '<li>اختصارات Alt+Tab وCtrl+C وCtrl+V وCtrl+S وCtrl+U، أو F12</li>' +
          '<li>النسخ أو اللصق أو القص، أو الضغط بزر الفأرة الأيمن</li>' +
          '<li>الدخول بنفس الحساب من جهاز آخر أثناء الاختبار</li>' +
          '<li>تجاوز حد إعادة التحميل (' + MAX_RELOADS + ' مرات)</li>' +
        '</ul></div>' +
        '<label class="xq-agree" for="agreeCheckbox"><input type="checkbox" id="agreeCheckbox"><span>قرأت التعليمات والمخالفات وأوافق على بدء الاختبار الآن</span></label>' +
        '<button class="ui-btn ui-btn-accent ui-btn-block" id="startExamBtn" disabled>' + icon('play') + ' ابدأ الاختبار</button>' +
      '</div>';

    const agreeCheckbox = document.getElementById('agreeCheckbox');
    const startExamBtn = document.getElementById('startExamBtn');

    agreeCheckbox.addEventListener('change', function () {
      startExamBtn.disabled = !agreeCheckbox.checked;
    });

    startExamBtn.addEventListener('click', function () {
      if (!agreeCheckbox.checked) return;
      startExamBtn.disabled = true;
      startExamBtn.textContent = 'جارٍ التحضير...';
      document.getElementById('examTimer').style.display = 'flex';
      startNewExam();
    });
  }

  function startNewExam() {
    const questionCount = examData.questionCount || 10;
    getRandomQuestions(compId, lessonId, examId, questionCount)
      .then(function(selectedQuestions) {
        if (!selectedQuestions || selectedQuestions.length === 0) {
          throw new Error('لا توجد أسئلة في هذا الاختبار. أضف أسئلة أولاً.');
        }
        return startExamAttempt(compId, lessonId, examId, currentUser.uid, selectedQuestions)
          .then(function() {
            return db.ref('examAttempts/' + compId + '/' + lessonId + '/' + examId + '/' + currentUser.uid + '/sessionId')
              .set(localStorage.getItem('awab_session_id'));
          })
          .then(function() {
            questionsData = selectedQuestions;
            questionIds = selectedQuestions.map(function(q) { return q.id; });
            userAnswers = {};
            reloadCount = 0;
            updateReloadWarning();
            examDuration = examData.duration || 10;
            startTime = Date.now();
            document.getElementById('timerDisplay').textContent = formatTime(examDuration * 60);
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            renderExam();
            startProtection();
            sessionCheckInterval = setInterval(checkSessionPeriodically, 5000);
          });
      })
      .catch(function(err) {
        document.getElementById('content').innerHTML = stateCard('xmark', 'تعذر بدء الاختبار', escapeHtml(err.message), 'back', true);
      });
  }

  function restoreExam(attempt) {
    if (attempt.submitted || attempt.forceEnded) {
      // تم إنهاء المحاولة بالفعل
      showAlreadySubmitted('هذه المحاولة انتهت. لا يمكنك إعادة الاختبار.');
      return;
    }

    // ✅ محاولة فاسدة/ناقصة (مفيهاش أسئلة أصلاً، غالبًا بسبب تصفير جزئي من لوحة التحكم):
    // نمسحها تلقائيًا ونبدأ محاولة جديدة نضيفة بدل ما نحاول نسترجعها ونطيح الصفحة.
    if (!attempt.questions || attempt.questions.length === 0) {
      db.ref('examAttempts/' + compId + '/' + lessonId + '/' + examId + '/' + currentUser.uid).remove()
        .then(function() { startNewExam(); })
        .catch(function() { startNewExam(); });
      return;
    }

    // ✅ السماح بإعادة تحميل الصفحة حتى MAX_RELOADS مرة قبل إنهاء الاختبار قسريًا
    reloadCount = (attempt.reloadCount || 0) + 1;
    if (reloadCount > MAX_RELOADS) {
      forceEndExam('لقد تجاوزت الحد المسموح لإعادة تحميل صفحة الاختبار (' + MAX_RELOADS + ' مرات).');
      return;
    }
    db.ref('examAttempts/' + compId + '/' + lessonId + '/' + examId + '/' + currentUser.uid + '/reloadCount').set(reloadCount);
    updateReloadWarning();

    // استرجاع المحاولة النشطة
    examDuration = examData.duration || 10;
    questionsData = attempt.questions || [];
    questionIds = questionsData.map(function(q) { return q.id; });
    userAnswers = attempt.answers || {};
    violationCount = attempt.violations || 0;
    document.getElementById('violationCount').textContent = violationCount;
    if (violationCount >= maxViolations) {
      submitExam(true);
      return;
    }
    const elapsed = Math.floor((Date.now() - attempt.startedAt) / 1000);
    const totalSeconds = examDuration * 60;
    const remaining = Math.max(0, totalSeconds - elapsed);
    document.getElementById('timerDisplay').textContent = formatTime(remaining);
    if (remaining <= 0) {
      submitExam(true);
      return;
    }
    startTime = Date.now() - elapsed * 1000;
    document.getElementById('examTimer').style.display = 'flex';
    timerInterval = setInterval(updateTimer, 1000);
    renderExam();
    startProtection();
    sessionCheckInterval = setInterval(checkSessionPeriodically, 5000);
  }

  function updateReloadWarning() {
    const el = document.getElementById('reloadWarning');
    document.getElementById('reloadCountDisplay').textContent = reloadCount;
    document.getElementById('maxReloads').textContent = MAX_RELOADS;
    if (el) { if (reloadCount > 0) el.style.display = ''; el.classList.toggle('show', reloadCount > 0); }
  }

  function checkSessionPeriodically() {
    if (isSubmitted || isForceEnded) return;
    checkSession(currentUser).then(function(result) {
      if (!result.valid) {
        logViolation(currentUser.uid, compId + '_' + lessonId + '_' + examId, 'session_mismatch', 'تم اكتشاف جلسة جديدة من جهاز آخر');
        submitExam(true);
      }
    });
  }

  // ===== نظام المخالفات المحسّن =====
  function startProtection() {
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      logViolationAndIncrement('right_click', 'محاولة استخدام القائمة المنسدلة');
    });

    document.addEventListener('copy', function(e) {
      e.preventDefault();
      logViolationAndIncrement('copy_attempt', 'محاولة نسخ');
    });
    document.addEventListener('paste', function(e) {
      e.preventDefault();
      logViolationAndIncrement('paste_attempt', 'محاولة لصق');
    });
    document.addEventListener('cut', function(e) {
      e.preventDefault();
      logViolationAndIncrement('cut_attempt', 'محاولة قص');
    });

    document.addEventListener('keydown', function(e) {
      const key = e.key;
      const ctrl = e.ctrlKey || e.metaKey;
      if (ctrl && (key === 'c' || key === 'v' || key === 'u' || key === 's')) {
        e.preventDefault();
        logViolationAndIncrement('keyboard_shortcut', 'استخدام اختصار ' + key);
      }
      if (key === 'F12') {
        e.preventDefault();
        logViolationAndIncrement('devtools', 'فتح أدوات المطور');
      }
      if (e.altKey && (key === 'Tab' || key === 'F4')) {
        e.preventDefault();
        logViolationAndIncrement('alt_tab', 'استخدام Alt+Tab');
      }
    });

    // مراقبة تغيير التبويب (visibilitychange)
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        if (!isSubmitted && !isForceEnded) {
          isTabActive = false;
          const details = 'تم تغيير التبويب (الانتقال لتبويب آخر في المتصفح)';
          logViolationAndIncrement('tab_switch', details);
          showProtectionOverlay(
            '⚠️ تم تغيير التبويب',
            'هذا يُعتبر مخالفة (' + (violationCount + 1) + '/' + maxViolations + '). الرجاء العودة للاختبار فوراً.'
          );
        }
      } else {
        isTabActive = true;
        hideProtectionOverlay();
      }
    });

    // مراقبة فقدان التركيز (blur) - مع تجنب تكرار المخالفة
    window.addEventListener('blur', function() {
      if (document.hidden) return;
      if (!isSubmitted && !isForceEnded) {
        const details = 'تم تصغير المتصفح أو التبديل إلى تطبيق آخر (فقدان التركيز)';
        logViolationAndIncrement('window_blur', details);
        showProtectionOverlay(
          '⚠️ تم تصغير المتصفح أو التبديل لتطبيق آخر',
          'هذا يُعتبر مخالفة (' + (violationCount + 1) + '/' + maxViolations + '). الرجاء العودة للاختبار فوراً.'
        );
      }
    });
    window.addEventListener('focus', function() {
      hideProtectionOverlay();
    });

    window.addEventListener('beforeunload', function(e) {
      if (!isSubmitted && !isForceEnded) {
        e.preventDefault();
        e.returnValue = 'هل أنت متأكد من مغادرة الصفحة؟ إجاباتك محفوظة، لكن يُسمح بإعادة التحميل ' + MAX_RELOADS + ' مرات فقط طوال الاختبار.';
      }
    });
  }

  function logViolationAndIncrement(type, details) {
    if (isSubmitted || isForceEnded) return;
    const examRef = compId + '_' + lessonId + '_' + examId;
    logViolation(currentUser.uid, examRef, type, details);
    incrementViolations(compId, lessonId, examId, currentUser.uid).then(function() {
      violationCount++;
      document.getElementById('violationCount').textContent = violationCount;
      document.getElementById('violationWarning').style.display = '';
      document.getElementById('violationWarning').classList.add('show');
      if (violationCount >= maxViolations) {
        submitExam(true);
      }
    });
  }

  function showProtectionOverlay(title, detail) {
    const overlay = document.getElementById('protectionOverlay');
    overlay.querySelector('#protectionMsg').textContent = title;
    overlay.querySelector('#protectionDetail').textContent = detail;
    overlay.classList.add('show');
  }

  function hideProtectionOverlay() {
    document.getElementById('protectionOverlay').classList.remove('show');
  }

  document.getElementById('returnToExamBtn').addEventListener('click', function() {
    hideProtectionOverlay();
    window.focus();
  });

  // ===== العداد الزمني =====
  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function updateTimer() {
    if (isSubmitted || isForceEnded) return;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const remaining = Math.max(0, (examDuration * 60) - elapsed);
    document.getElementById('timerDisplay').textContent = formatTime(remaining);
    document.getElementById('examTimer').classList.toggle('is-low', remaining <= 60);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      alert('⏰ انتهى الوقت المحدد للاختبار. سيتم تسليم إجاباتك تلقائياً.');
      submitExam(true);
    }
  }

  // ===== عرض الاختبار =====
  function renderExam() {
    const content = document.getElementById('content');
    const total = questionIds.length;
    if (total === 0) {
      content.innerHTML = '<p class="muted">لا توجد أسئلة.</p>';
      return;
    }
    const qId = questionIds[currentQuestionIndex];
    const q = questionsData[currentQuestionIndex];
    const isLast = (currentQuestionIndex === total - 1);

    const letters = ['أ', 'ب', 'ج', 'د', 'هـ', 'و'];
    let navHtml = '<div class="xq-progress"><div class="xq-progress-track"><div class="xq-progress-fill" id="examProgressFill"></div></div>' +
      '<span class="xq-progress-label" id="examProgressLabel"></span></div><div class="xq-nav" id="xqNav">';
    questionIds.forEach((id, idx) => {
      let cls = 'xq-dot';
      if (idx === currentQuestionIndex) cls += ' active';
      else if (userAnswers[id] !== undefined) cls += ' answered';
      else if (idx < currentQuestionIndex) cls += ' viewed';
      navHtml += '<button class="' + cls + '" data-index="' + idx + '">' + (idx + 1) + '</button>';
    });
    navHtml += '</div>';

    let qHtml = '<div class="xq-card"><span class="xq-qlabel">سؤال ' + (currentQuestionIndex + 1) + ' من ' + total + '</span>' +
      '<p class="xq-qtext">' + escapeHtml(q.text) + '</p><div class="xq-options">';
    q.options.forEach((opt, oi) => {
      const checked = (userAnswers[qId] === oi) ? 'checked' : '';
      qHtml += '<label class="xq-option"><input type="radio" name="q_' + qId + '" value="' + oi + '" ' + checked + ' onchange="recordAnswer(\'' + qId + '\', ' + oi + ')">' +
        '<span class="xq-letter">' + (letters[oi] || (oi + 1)) + '</span><span class="xq-opt-text">' + escapeHtml(opt) + '</span></label>';
    });
    qHtml += '</div></div>';

    let actionsHtml = '<div class="xq-bar exam-actions">' +
      '<button class="ui-btn ui-btn-soft" onclick="goToQuestion(' + (currentQuestionIndex - 1) + ')"' + (currentQuestionIndex === 0 ? ' disabled' : '') + '>السابق</button>';
    if (!isLast) {
      actionsHtml += '<button class="ui-btn ui-btn-primary" onclick="goToQuestion(' + (currentQuestionIndex + 1) + ')">التالي</button>';
    } else if (!isSubmitted && !isForceEnded) {
      actionsHtml += '<button class="ui-btn ui-btn-accent btn-submit-final" onclick="openConfirm()">' + icon('paperPlane') + ' تسليم الاختبار</button>';
    }
    actionsHtml += '</div>';

    content.innerHTML = navHtml + qHtml + actionsHtml + '<div id="resultArea"></div>';
    const activeDot = document.querySelector('#xqNav .xq-dot.active');
    if (activeDot && activeDot.scrollIntoView) activeDot.scrollIntoView({ block: 'nearest', inline: 'center' });
    updateExamProgressBar();

    document.querySelectorAll('#xqNav .xq-dot').forEach(btn => {
      btn.addEventListener('click', function() {
        if (!isSubmitted && !isForceEnded) goToQuestion(parseInt(this.dataset.index));
      });
    });
  }

  function goToQuestion(index) {
    if (isSubmitted || isForceEnded) return;
    currentQuestionIndex = index;
    renderExam();
  }

  function recordAnswer(qId, selected) {
    if (isSubmitted || isForceEnded) return;
    userAnswers[qId] = selected;
    saveAnswer(compId, lessonId, examId, currentUser.uid, qId, selected)
      .catch(function(err) { console.warn('فشل حفظ الإجابة:', err); });
    const btns = document.querySelectorAll('#xqNav .xq-dot');
    const idx = questionIds.indexOf(qId);
    if (idx >= 0 && btns[idx] && idx !== currentQuestionIndex) {
      btns[idx].classList.remove('viewed');
      btns[idx].classList.add('answered');
    }
    updateExamProgressBar();
  }

  window.recordAnswer = recordAnswer;
  window.goToQuestion = goToQuestion;
  window.openConfirm = openConfirm;

  function updateExamProgressBar() {
    const bar = document.getElementById('examProgressFill');
    const label = document.getElementById('examProgressLabel');
    if (!bar || !label) return;
    const total = questionIds.length;
    const answered = questionIds.filter(function (id) { return userAnswers[id] !== undefined; }).length;
    const pct = total ? Math.round((answered / total) * 100) : 0;
    bar.style.width = pct + '%';
    label.textContent = 'أجبت عن ' + answered + ' من ' + total;
  }

  function openConfirm() {
    if (isSubmitted || isForceEnded) return;
    showConfirm();
  }

  confirmYesBtn.addEventListener('click', function () {
    hideConfirm();
    if (!isSubmitted && !isForceEnded) submitExam(false);
  });

  function submitExam(autoSubmit) {
    if (isSubmitted) return;
    const total = questionIds.length;
    if (total === 0) {
      // لا توجد أسئلة لتسليمها (بيانات محاولة فاسدة) — لا تحاول الحفظ، امسح المحاولة وابدأ من جديد
      isSubmitted = true;
      clearInterval(timerInterval);
      clearInterval(sessionCheckInterval);
      db.ref('examAttempts/' + compId + '/' + lessonId + '/' + examId + '/' + currentUser.uid).remove()
        .finally(function() { location.reload(); });
      return;
    }
    isSubmitted = true;
    clearInterval(timerInterval);
    clearInterval(sessionCheckInterval);
    hideProtectionOverlay();
    let correct = 0;
    let earnedPoints = 0;
    const answersRecord = {};

    questionIds.forEach((qId, idx) => {
      const q = questionsData[idx];
      const selected = userAnswers[qId];
      answersRecord[qId] = (selected !== undefined) ? selected : -1;
      if (selected !== undefined && selected === q.correct) {
        correct++;
        earnedPoints += q.points || 10;
      }
    });

    const progRef = db.ref('userProgress/' + currentUser.uid + '/' + compId + '/' + lessonId);
    const examDataToSave = {
      completed: true,
      score: correct,
      totalQuestions: total,
      earnedPoints: earnedPoints,
      answers: answersRecord,
      answeredAt: firebase.database.ServerValue.TIMESTAMP
    };

    endExamAttempt(compId, lessonId, examId, currentUser.uid, true, false);

    // ✅ نقرأ نتيجة أي محاولة سابقة لنفس الاختبار قبل ما نقرر: لو الطالب بدأ محاولة
    // تانية (بعد ما المسؤول صفّر بياناته) وطلع بدرجة أقل من محاولته السابقة، نحتفظ
    // بالدرجة الأعلى ومنلمسش نقاطه. لو طلع بدرجة أعلى أو دي أول محاولة، نحفظ الجديدة.
    let keptPrevious = false;
    let prevEarnedForMsg = 0;
    progRef.child('exams/' + examId).once('value')
      .then((prevSnap) => {
        const prevData = prevSnap.val() || {};
        const prevEarned = prevData.earnedPoints || 0;
        prevEarnedForMsg = prevEarned;
        if (earnedPoints >= prevEarned) {
          return progRef.child('exams/' + examId).set(examDataToSave)
            .then(() => db.ref('users/' + currentUser.uid + '/points').transaction((current) => (current || 0) + (earnedPoints - prevEarned)));
        }
        // المحاولة الجديدة أقل من الأعلى المسجلة سابقًا: نحتفظ بالبيانات القديمة كما هي
        keptPrevious = true;
        return Promise.resolve();
      })
      .then(() => progRef.once('value'))
      .then((snap) => {
        const lp = snap.val() || {};
        const c = computeLessonCompletion(lessonData, lp);
        return progRef.update({ completed: c.completed, earnedPoints: c.earnedPoints });
      })
      .then(() => {
        const percentage = Math.round((correct / total) * 100);
        let extra = '';
        if (autoSubmit) extra += '<p class="xq-result-note is-danger">تم التسليم تلقائياً.</p>';
        if (keptPrevious) extra += '<p class="xq-result-note is-muted">درجتك هنا (' + earnedPoints + ' نقطة) أقل من أعلى نتيجة سابقة (' + prevEarnedForMsg + ' نقطة)، لذلك تم الاحتفاظ بالأعلى.</p>';
        document.getElementById('examTimer').style.display = 'none';
        document.getElementById('violationWarning').style.display = 'none';
        document.getElementById('reloadWarning').style.display = 'none';
        document.getElementById('content').innerHTML = resultCard(percentage, percentage, earnedPoints, correct, total, '', extra);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.querySelectorAll('.exam-actions button, .btn-submit-final').forEach(b => b.disabled = true);
        sendExamResultEmail({
          studentName: currentUserData.name || '',
          studentEmail: currentUserData.email || currentUser.email || '',
          competitionName: compData.title || '',
          lessonName: lessonData.title || '',
          score: correct,
          totalQuestions: total,
          percentage: percentage,
          earnedPoints: earnedPoints,
          completionDate: formatArabicDate(Date.now())
        });
      })
      .catch(err => {
        alert('❌ حدث خطأ أثناء حفظ النتيجة: ' + err.message);
        isSubmitted = false;
      });
  }

  function forceEndExam(reason) {
    if (isForceEnded) return;
    isForceEnded = true;
    clearInterval(timerInterval);
    clearInterval(sessionCheckInterval);
    hideProtectionOverlay();
    endExamAttempt(compId, lessonId, examId, currentUser.uid, false, true);
    document.getElementById('examTimer').style.display = 'none';
    document.getElementById('violationWarning').style.display = 'none';
    document.getElementById('content').innerHTML = stateCard('circleXmark', 'تم إنهاء الاختبار', escapeHtml(reason), 'back', true);
    document.querySelectorAll('.exam-actions button, .btn-submit-final').forEach(b => b.disabled = true);
  }

  window.forceEndExam = forceEndExam;

  window.addEventListener('beforeunload', function() {
    if (!isSubmitted && !isForceEnded) {
      logViolation(currentUser.uid, compId + '_' + lessonId + '_' + examId, 'page_reload', 'إعادة تحميل الصفحة (محاولة رقم ' + (reloadCount + 1) + ' من ' + MAX_RELOADS + ')');
    }
  });

</script>
</body>
