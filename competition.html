<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>تفاصيل المحتوى — منصة أواب الإلكترونية</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="shell.css?v=1">
<link rel="stylesheet" href="course.css?v=1">
</head>
<body>

<header class="ah-bar" id="appHeader"></header>

<main class="page cd-page">
  <a class="cd-back" href="home.html" id="backLink"></a>

  <div class="cd-layout">
    <div class="cd-main">
      <div id="courseHero"></div>
      <div id="lessonsWrap">
        <div class="center-loading" style="min-height:240px;"><div class="loader"></div></div>
      </div>
    </div>
    <aside class="cd-side" id="courseSide"></aside>
  </div>
</main>

<!-- نافذة الوصف الكامل -->
<div class="modal-overlay" id="descModal">
  <div class="modal">
    <button class="modal-close" id="closeDescModal" aria-label="إغلاق"></button>
    <h3 id="descModalTitle" style="font-family:'Cairo',sans-serif; font-weight:800; color:var(--primary-dark);"></h3>
    <p id="descModalBody" style="font-size:14px; line-height:1.9; color:var(--text); white-space:pre-wrap; word-wrap:break-word; margin:0;"></p>
  </div>
</div>

<!-- نافذة تأكيد الاشتراك -->
<div class="modal-overlay" id="subscribeModal">
  <div class="modal" style="max-width:400px; text-align:center;">
    <h3 id="subscribeModalTitle" style="font-family:'Cairo',sans-serif; font-weight:800; color:var(--primary-dark);">تأكيد الاشتراك</h3>
    <p id="subscribeModalBody" style="font-size:14px; line-height:1.8; color:var(--text); margin:0 0 22px; white-space:pre-wrap; word-wrap:break-word;">هل تريد تأكيد الاشتراك؟</p>
    <div style="display:flex; gap:10px;">
      <button type="button" class="btn btn-primary" id="confirmSubscribeBtn" style="flex:1;">نعم</button>
      <button type="button" class="btn btn-outline" id="cancelSubscribeBtn" style="flex:1;">لا</button>
    </div>
  </div>
</div>

<footer class="sf-footer" id="siteFooter"></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="icons.js?v=2"></script>
<script src="app-shell.js?v=3"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const compId = params.get('id');
  if (!compId) window.location.href = 'home.html';

  let compData = null;
  let progressData = {};
  let isEnrolled = false;
  let currentUser = null;
  /* المحاضرات المفتوحة حاليًا (بتفضل زي ما هي حتى لو الصفحة اتحدّثت من Firebase)؛ null = لسه ما اتحددتش */
  let openLessons = null;

  document.getElementById('backLink').innerHTML = icon('arrowRight') + ' كل المحتوى';
  document.getElementById('closeDescModal').innerHTML = icon('xmark');

  requireAuth(function (user, userData) {
    currentUser = user;
    renderAppHeader(user, userData, { showPoints: true });
    renderFooter();

    db.ref('userProgress/' + user.uid + '/' + compId).on('value', function (snap) {
      progressData = snap.val() || {};
      if (compData) render();
    });

    db.ref('userEnrollments/' + user.uid + '/' + compId).on('value', function (snap) {
      isEnrolled = snap.exists();
      if (compData) render();
    });

    db.ref('competitions/' + compId).on('value', function (snap) {
      if (!snap.exists()) { window.location.href = 'home.html'; return; }
      compData = snap.val();
      document.title = (compData.title || 'تفاصيل المحتوى') + ' — منصة أواب الإلكترونية';
      render();
    });
  });

  function render() {
    renderHero();
    renderSide();
    renderLessons();
  }

  /* يمنع روابط javascript: وما شابه — مسموح http/https والروابط النسبية فقط */
  function safeUrl(u) {
    u = String(u || '').trim();
    return (/^(https?:)?\/\//i.test(u) || /^data:image\//i.test(u) || /^[\w./#?=&%-]+$/.test(u)) ? u : '#';
  }

  /* ===== الاشتراك ===== */
  function subscribe() {
    const now = firebase.database.ServerValue.TIMESTAMP;
    const updates = {};
    updates['enrollments/' + compId + '/' + currentUser.uid] = now;
    updates['userEnrollments/' + currentUser.uid + '/' + compId] = now;
    return db.ref().update(updates);
  }

  document.getElementById('cancelSubscribeBtn').addEventListener('click', function () {
    document.getElementById('subscribeModal').classList.remove('open');
  });
  document.getElementById('subscribeModal').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('open');
  });
  document.getElementById('confirmSubscribeBtn').addEventListener('click', function () {
    const btn = this;
    btn.disabled = true;
    btn.textContent = 'جارٍ الاشتراك...';
    subscribe().then(function () {
      document.getElementById('subscribeModal').classList.remove('open');
    }).catch(function (err) {
      alert('تعذر تسجيل الاشتراك: ' + err.message);
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = 'نعم';
    });
  });

  /* ===== إحصائيات المحتوى ===== */
  function countContent(lessons) {
    let videos = 0, exams = 0, files = 0;
    Object.keys(lessons).forEach(function (id) {
      const l = lessons[id] || {};
      videos += Object.keys(l.videos || {}).length;
      exams += Object.keys(l.exams || {}).length;
      files += Object.keys(l.materials || {}).length;
    });
    return { lectures: countLectures(lessons), videos: videos, exams: exams, files: files };
  }

  /* ===== بطاقة المعلومات الأساسية ===== */
  const DESC_LIMIT = 220;

  function renderHero() {
    const hero = document.getElementById('courseHero');
    const desc = compData.description || '';
    const isLong = desc.length > DESC_LIMIT;
    const shownDesc = isLong ? desc.slice(0, DESC_LIMIT).trim() + '…' : desc;
    const isCourse = compData.type !== 'competition';
    const lessons = compData.lessons || {};
    const c = countContent(lessons);
    const coursePct = isEnrolled ? computeCourseProgress(lessons, progressData) : 0;

    function stat(cls, ico, num, label) {
      return '<div class="cd-stat ' + cls + '"><span class="cd-stat-ico">' + icon(ico) + '</span><div><b>' + num + '</b><span>' + label + '</span></div></div>';
    }

    hero.innerHTML =
      '<section class="cd-hero">' +
        '<div class="cd-badges">' +
          '<span class="cd-type ' + (isCourse ? 'course' : 'competition') + '">' + icon(isCourse ? 'bookOpen' : 'trophy') + (isCourse ? 'كورس' : 'مسابقة') + '</span>' +
          (isEnrolled ? '<span class="cd-enrolled-tag">' + icon('circleCheck') + (isCourse ? 'أنت مشترك' : 'أنت منضم') + '</span>' : '') +
        '</div>' +
        '<h1 class="cd-title">' + escapeHtml(compData.title || 'بدون عنوان') + '</h1>' +
        (desc ? '<p class="cd-desc">' + escapeHtml(shownDesc) + '</p>' : '') +
        (isLong ? '<button type="button" class="cd-more" id="descMoreBtn">عرض المزيد ' + icon('chevronLeft') + '</button>' : '') +

        (compData.instructorName ?
          '<div class="cd-teacher">' +
            (compData.instructorPhotoUrl
              ? '<img class="cd-teacher-avatar" src="' + escapeHtml(safeUrl(compData.instructorPhotoUrl)) + '" alt="' + escapeHtml(compData.instructorName) + '">'
              : '<span class="cd-teacher-avatar">' + icon('graduationCap') + '</span>') +
            '<div class="cd-teacher-info"><small>معلم المادة</small><strong>' + escapeHtml(compData.instructorName) + '</strong></div>' +
          '</div>' : '') +

        '<div class="cd-stats">' +
          stat('lec', 'bookOpen', c.lectures, 'محاضرة') +
          stat('vid', 'video', c.videos, 'فيديو شرح') +
          stat('exam', 'listCheck', c.exams, 'اختبار') +
          (c.files ? stat('file', 'filePdf', c.files, 'ملف ومرفق') : '') +
        '</div>' +

        (isEnrolled && c.lectures > 0 ?
          '<div class="cd-progress">' +
            '<div class="cd-progress-head"><span>تقدّمك في المحاضرات</span><span>' + coursePct + '%</span></div>' +
            '<div class="cd-progress-bar"><div class="cd-progress-fill" style="width:' + coursePct + '%;"></div></div>' +
          '</div>' : '') +
      '</section>';

    if (isLong) {
      document.getElementById('descMoreBtn').addEventListener('click', function () {
        document.getElementById('descModalTitle').textContent = compData.title || '';
        document.getElementById('descModalBody').textContent = desc;
        document.getElementById('descModal').classList.add('open');
      });
    }
  }

  /* ===== الشريط الجانبي: الغلاف + الاشتراك + المنتدى ===== */
  function renderSide() {
    const side = document.getElementById('courseSide');
    const isCourse = compData.type !== 'competition';
    const subscribeLabel = isCourse ? 'اشترك في الكورس' : 'انضم للمسابقة';

    side.innerHTML =
      '<div class="cd-cover">' +
        (compData.coverUrl
          ? '<img src="' + escapeHtml(safeUrl(compData.coverUrl)) + '" alt="">'
          : '<div class="cd-cover-ph">' + icon(isCourse ? 'bookOpen' : 'trophy', 'icon-xl') + '</div>') +
      '</div>' +
      '<div class="cd-side-body">' +
        (isEnrolled
          ? '<div class="cd-cta done">' + icon('circleCheck') + ' ' + (isCourse ? 'أنت مشترك بالفعل' : 'أنت منضم بالفعل') + '</div>'
          : '<button type="button" class="cd-cta" id="subscribeBtn">' + icon('gem') + ' ' + subscribeLabel + ' — مجانًا</button>') +
        '<a class="cd-forum" href="forum.html?id=' + encodeURIComponent(compId) + '">' + icon('commentDots') + ' منتدى الأسئلة</a>' +
        '<ul class="cd-perks">' +
          '<li>' + icon('circleCheck') + ' وصول كامل مجانًا</li>' +
          '<li>' + icon('circleCheck') + ' منتدى أسئلة يرد عليه المسؤول</li>' +
          '<li>' + icon('circleCheck') + ' تتبّع تقدّمك وجمّع النقاط</li>' +
        '</ul>' +
      '</div>';

    if (!isEnrolled) {
      document.getElementById('subscribeBtn').addEventListener('click', function () {
        document.getElementById('subscribeModalTitle').textContent = subscribeLabel;
        document.getElementById('subscribeModalBody').textContent = isCourse
          ? 'هل تريد تأكيد الاشتراك في هذا الكورس؟'
          : 'هل تريد تأكيد الانضمام لهذه المسابقة؟';
        document.getElementById('subscribeModal').classList.add('open');
      });
    }
  }

  /* ===== عناصر القائمة ===== */
  function itemRow(cls, href, ico, title, statusHtml, external) {
    return '<a class="cd-item ' + cls + '" href="' + href + '"' + (external ? ' target="_blank" rel="noopener"' : '') + '>' +
      '<span class="cd-item-ico">' + icon(ico) + '</span>' +
      '<span class="cd-item-title">' + title + '</span>' +
      '<span class="cd-item-status">' + statusHtml + '</span>' +
    '</a>';
  }
  function materialRows(materials) {
    return Object.keys(materials).map(function (mid) {
      const m = materials[mid];
      const isPdf = m.type === 'pdf';
      return itemRow('file' + (isPdf ? '' : ' image'), escapeHtml(safeUrl(m.url)), isPdf ? 'filePdf' : 'image',
        escapeHtml(m.name || 'مرفق'), 'فتح ' + icon('arrowUpRightFromSquare'), true);
    }).join('');
  }
  function secBlock(label, itemsHtml) {
    if (!itemsHtml) return '';
    return '<div class="cd-sec"><div class="cd-sec-label">' + label + '</div><div class="cd-sec-items">' + itemsHtml + '</div></div>';
  }

  /* ===== قائمة المحاضرات + دروس الملفات ===== */
  function renderLessons() {
    const wrap = document.getElementById('lessonsWrap');
    const lessons = compData.lessons || {};
    const ids = getSortedLessonIds(lessons);
    /* المحاضرة الحقيقية = فيها فيديو أو اختبار. الدرس اللي فيه ملفات بس بيتعرض لوحده كـ"ملفات" ومش بيتحسب محاضرة */
    const lectureIds = ids.filter(function (id) { return isLectureLesson(lessons[id]); });
    const fileIds = ids.filter(function (id) { return isFilesOnlyLesson(lessons[id]); });

    if (lectureIds.length === 0 && fileIds.length === 0) {
      wrap.innerHTML = '<div class="cd-empty">' + icon('video') + '<p>لا توجد محاضرات مضافة بعد</p></div>';
      return;
    }

    if (!isEnrolled) {
      const isCourse = compData.type !== 'competition';
      wrap.innerHTML =
        '<div class="cd-lock">' +
          '<div class="cd-lock-ico">' + icon('lock') + '</div>' +
          '<h3>المحتوى مقفول</h3>' +
          '<p>' + (isCourse ? 'اشترك في الكورس أولاً' : 'انضم للمسابقة أولاً') + ' للوصول إلى المحاضرات والفيديوهات والاختبارات والملفات.</p>' +
        '</div>';
      return;
    }

    const now = Date.now();
    /* اللي معاده ما جاش لسه بيتخفي تمامًا ويظهر تلقائيًا لما يجي معاده */
    const released = function (id) { const l = lessons[id]; return !l.releaseAt || l.releaseAt <= now; };
    const visibleLectures = lectureIds.filter(released);
    const visibleFileLessons = fileIds.filter(released);

    /* أول فتح للصفحة: افتح المحاضرة الحالية (أول محاضرة متاحة ولسه ما خلصتش) */
    let currentId = null;
    visibleLectures.some(function (id) {
      const access = getLessonAccessState(lessons, progressData, id);
      if (access.allowed && !(progressData[id] && progressData[id].completed)) { currentId = id; return true; }
      return false;
    });
    if (openLessons === null) openLessons = new Set(currentId ? [currentId] : []);

    let html = '';

    /* ---------- المحاضرات ---------- */
    if (lectureIds.length > 0) {
      html += '<section><div class="cd-section-head"><span class="cd-section-ico">' + icon('bookOpen') + '</span><h2>المحاضرات</h2><span class="cd-count-pill">' + lectureIds.length + '</span></div>';
      if (visibleLectures.length === 0) {
        html += '<div class="cd-empty">' + icon('video') + '<p>لا توجد محاضرات متاحة الآن</p></div>';
      } else {
        html += '<div class="cd-list">';
        visibleLectures.forEach(function (lessonId, index) {
          html += lectureCard(lessons, lessonId, index, lessonId === currentId, now);
        });
        html += '</div>';
      }
      html += '</section>';
    }

    /* ---------- الملفات والمرفقات (دروس من غير فيديو/اختبار) ---------- */
    if (visibleFileLessons.length > 0) {
      html += '<section><div class="cd-section-head"><span class="cd-section-ico files">' + icon('filePdf') + '</span><h2>الملفات والمرفقات</h2></div><div class="cd-list">';
      visibleFileLessons.forEach(function (lessonId) {
        const lesson = lessons[lessonId];
        const desc = (lesson.description || '').trim();
        html +=
          '<div class="cd-fgroup">' +
            '<h3 class="cd-fgroup-title">' + escapeHtml(lesson.title || 'ملفات') + '</h3>' +
            (desc ? '<p class="cd-fgroup-desc">' + escapeHtml(desc) + '</p>' : '') +
            '<div class="cd-sec-items">' + materialRows(lesson.materials || {}) + '</div>' +
          '</div>';
      });
      html += '</div></section>';
    }

    if (!html) {
      html = '<div class="cd-empty">' + icon('video') + '<p>لا توجد محاضرات متاحة الآن</p></div>';
    }
    wrap.innerHTML = html;
  }

  function lectureCard(lessons, lessonId, index, isCurrent, now) {
    const lesson = lessons[lessonId];
    const lessonProgress = progressData[lessonId] || {};
    const done = !!lessonProgress.completed;
    const access = getLessonAccessState(lessons, progressData, lessonId);
    const isLocked = !access.allowed;
    const isOpen = !isLocked && openLessons.has(lessonId);

    const videos = lesson.videos || {};
    const exams = lesson.exams || {};
    const materials = lesson.materials || {};
    const videoIds = Object.keys(videos);
    const examIds = Object.keys(exams);
    const materialIds = Object.keys(materials);

    let lockNote = '';
    if (access.reason === 'release') {
      lockNote = '<span class="cd-lec-lock">' + icon('clock') + ' يُنشر في ' + formatArabicDate(lesson.releaseAt) + '</span>';
    } else if (access.reason === 'sequence') {
      lockNote = '<span class="cd-lec-lock">' + icon('lock') + ' أكمِل المحاضرة السابقة أولاً</span>';
    }

    const q = encodeURIComponent;
    let videosHtml = '';
    videoIds.forEach(function (vid, vi) {
      const v = videos[vid];
      const watched = !!(lessonProgress.videos && lessonProgress.videos[vid] && lessonProgress.videos[vid].watched);
      videosHtml += itemRow('video' + (watched ? ' done' : ''),
        'video.html?comp=' + q(compId) + '&lesson=' + q(lessonId) + '&video=' + q(vid),
        'play', escapeHtml(v.title || ('فيديو الشرح ' + (vi + 1))),
        watched ? icon('check') + ' تمت المشاهدة' : 'مشاهدة');
    });

    let examsHtml = '';
    let visibleExamCount = 0;
    examIds.forEach(function (eid, ei) {
      const ex = exams[eid];
      /* الاختبار له معاد نشر خاص: لو لسه ما جاش بيتخفي */
      if (ex.releaseAt && ex.releaseAt > now) return;
      visibleExamCount++;
      const qCount = ex.questions ? Object.keys(ex.questions).length : 0;
      const examProgress = lessonProgress.exams && lessonProgress.exams[eid];
      const examDone = !!(examProgress && examProgress.completed);
      examsHtml += itemRow('exam' + (examDone ? ' done' : ''),
        'exam.html?comp=' + q(compId) + '&lesson=' + q(lessonId) + '&exam=' + q(eid),
        'listCheck', escapeHtml(ex.title || ('الاختبار ' + (ei + 1))),
        examDone ? icon('check') + ' أنجزت +' + (examProgress.earnedPoints || 0) : qCount + ' سؤال · ابدأ');
    });

    const itemsCount = videoIds.length + visibleExamCount + materialIds.length;
    const sections =
      secBlock('الشرح', videosHtml) +
      secBlock('الامتحان', examsHtml) +
      secBlock('المرفقات', materialRows(materials));

    /* وصف المحاضرة مختصر + "عرض المزيد" في نفس مكانه */
    const desc = (lesson.description || '').trim();
    const DESC_SHORT = 80;
    let subHtml;
    if (desc) {
      const isLong = desc.length > DESC_SHORT;
      const shortDesc = isLong ? desc.slice(0, DESC_SHORT).trim() + '…' : desc;
      subHtml =
        '<span class="cd-lec-desc" data-full="' + escapeHtml(desc) + '" data-short="' + escapeHtml(shortDesc) + '" data-expanded="0">' +
          '<span class="cd-lec-desc-text" style="white-space:pre-wrap;">' + escapeHtml(shortDesc) + '</span>' +
          (isLong ? ' <span class="cd-lec-more" role="button" data-role="desc-toggle">عرض المزيد</span>' : '') +
        '</span>';
    } else {
      subHtml = videoIds.length + ' فيديو · ' + visibleExamCount + ' اختبار' + (done ? ' · تم الإنجاز' : '');
    }

    const cls = 'cd-lec' + (isOpen ? ' open' : '') + (done ? ' is-done' : '') + (isLocked ? ' is-locked' : '') + (isCurrent && !done ? ' is-current' : '');
    const numInner = done ? icon('check') : (isLocked ? icon('lock') : (index + 1));

    return '<div class="' + cls + '" data-lesson="' + escapeHtml(lessonId) + '">' +
      '<button type="button" class="cd-lec-head" ' + (isLocked ? 'disabled' : '') + ' aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<span class="cd-lec-num">' + numInner + '</span>' +
        '<span class="cd-lec-main">' +
          '<h4 class="cd-lec-title">' + escapeHtml(lesson.title || 'محاضرة') + '</h4>' +
          '<span class="cd-lec-sub">' + (isLocked ? lockNote : subHtml) + '</span>' +
        '</span>' +
        (isLocked ? '' : '<span class="cd-lec-end"><span class="cd-lec-count">' + itemsCount + ' عنصر</span>' + icon('chevronDown', 'cd-lec-chev') + '</span>') +
      '</button>' +
      (isLocked ? '' :
        '<div class="cd-lec-body"><div class="cd-lec-inner"><div class="cd-lec-content">' +
          (sections || '<p class="cd-empty-note">لا يوجد محتوى متاح في هذه المحاضرة الآن.</p>') +
        '</div></div></div>') +
    '</div>';
  }

  /* ===== التفاعل: فتح/غلق المحاضرة + عرض المزيد (تفويض أحداث، يشتغل بعد كل إعادة رسم) ===== */
  document.getElementById('lessonsWrap').addEventListener('click', function (e) {
    const toggle = e.target.closest('[data-role="desc-toggle"]');
    if (toggle) {
      e.stopPropagation();
      const holder = toggle.closest('.cd-lec-desc');
      const textEl = holder.querySelector('.cd-lec-desc-text');
      const expanded = holder.getAttribute('data-expanded') === '1';
      textEl.textContent = expanded ? holder.getAttribute('data-short') : holder.getAttribute('data-full');
      toggle.textContent = expanded ? 'عرض المزيد' : 'عرض أقل';
      holder.setAttribute('data-expanded', expanded ? '0' : '1');
      return;
    }
    const head = e.target.closest('.cd-lec-head');
    if (head && !head.disabled) {
      const lec = head.closest('.cd-lec');
      const open = lec.classList.toggle('open');
      head.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (openLessons) { open ? openLessons.add(lec.dataset.lesson) : openLessons.delete(lec.dataset.lesson); }
    }
  });

  /* ===== إغلاق نافذة الوصف ===== */
  document.getElementById('closeDescModal').addEventListener('click', function () {
    document.getElementById('descModal').classList.remove('open');
  });
  document.getElementById('descModal').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('open');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.getElementById('descModal').classList.remove('open');
      document.getElementById('subscribeModal').classList.remove('open');
    }
  });
</script>
</body>
</html>
